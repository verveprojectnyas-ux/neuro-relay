  survey:"«Опрос волонтёров» — шкала удобства SUS: 10 утверждений с оценкой от 1 до 5 и вопрос о полезности фраз. После отправки приложение показывает балл SUS от 0 до 100; средний результат для программ — около 68.",
  log:"Каждое действие записывается в «Журнал сеанса» со временем, языком и способом ввода. Таблица есть внизу страниц «Разговор» и «Симулятор ЭЭГ», её можно выгрузить кнопкой «Экспорт CSV».",
  languages:"Язык переключается кнопками вверху: қазақша, русский, English, кыргызча. Вместе с языком меняются фразы, кнопки и голос. Если на устройстве нет казахского или кыргызского голоса, фразы читаются русским голосом.",
  ai:"ИИ-агент работает, только когда приложение открыто в claude.ai, вы вошли в аккаунт и разрешили приложению обращаться к Claude. Если разрешение однажды было отклонено, нажмите «Разрешить доступ к Claude» в жёлтой плашке выше или включите Claude в меню «Разрешения» этого приложения, затем обновите страницу."},
en:{prefix:"Built-in help (the AI Agent is unavailable right now; the reason is in the banner above):",
  general:"I can help with: signals and patient mode, starting a session, emergency buttons, the EEG simulator and neural network, profile and voice, the volunteer survey, the session log, languages. Ask a question with one of these words, for example “how do signals work”.",
  signals:"There are three signals. Signal 1 (blue) moves the highlight to the next tile. Signal 2 (green) is YES: choose the tile or confirm the phrase. Signal 3 (grey) is NO: cancel. On a keyboard or external switch these are keys 1, 2 and 3.",
  patient:"If the person can give only one signal, turn on “Patient mode — one switch” on the Talk page. The highlight moves by itself over the tiles and the red buttons, and the patient gives the signal (Space, a switch or a tap on the big button) when the wanted item is lit. Start slowly, at 2–3 seconds.",
  session:"Open Talk, type what you said to the patient (for example “Are you thirsty?”), choose a topic and press Get phrases. The patient picks a tile, the app asks “Say this out loud?”, and after YES the phrase is spoken and new ones appear. Filling in the profile makes the phrases more accurate.",
  emergency:"The red buttons at the bottom (“I’m in pain!”, “I can’t breathe!”, “Call the nurse!”) are always visible, do not depend on the AI and are spoken at once. In patient mode the highlight passes over them too. In a real emergency, call medical staff immediately.",
  eeg:"The EEG Simulator shows how a headset would control the app. The app generates a virtual user’s brain signal, the tiles flash, and the neural network finds the wanted phrase from the P300 wave. You can change signal quality and the number of flash rounds: more rounds are slower but more accurate.",
  network:"The neural network was trained in Python (layers 160–64–16–1) on real EEG recordings of 8 people with ALS (BNCI 008-2014, 33,600 flashes) and runs right in the browser. On new patients without calibration it picks 77% of letters right in a 6×6 table with 10 repetitions; with per-person calibration 91%, and the classic LDA method 95%, so a short calibration matters. The in-app simulator is tuned to these patients’ signals.",
  profile:"On the Profile page enter the full name, date of birth, sex, condition, relatives, favourite phrases and topics. Sex sets the voice and the grammar of phrases. Documents and phone numbers are stored separately: only the owner and editors can see them, and they are never sent to the AI.",
  survey:"The Volunteer Survey is the System Usability Scale: 10 statements rated 1 to 5, plus how useful the phrases were. After sending, the app shows a SUS score from 0 to 100; the average for software is about 68.",
  log:"Every action is saved in the Session Log with time, language and input method. The table is at the bottom of the Talk and EEG Simulator pages, and Export CSV saves it.",
  languages:"Switch the language with the buttons at the top: Қазақша, Русский, English, Кыргызча. Phrases, buttons and the voice change with it. If the device has no Kazakh or Kyrgyz voice, a Russian voice reads the phrases.",
  ai:"The AI Agent works only when this app is opened in claude.ai, you are signed in, and the app is allowed to use Claude. If that permission was declined once, press “Allow access to Claude” in the yellow banner above, or switch Claude on in this app’s Permissions menu, then reload the page."},
kk:{prefix:"Кірістірілген анықтама (ЖИ қазір қолжетімсіз, себебі жоғарыдағы жолақта жазылған):",
  general:"Мына тақырыптар бойынша көмектесемін: сигналдар мен науқас режимі, сеансты бастау, шұғыл батырмалар, ЭЭГ симуляторы мен нейрожелі, профиль мен дауыс, еріктілер сауалнамасы, сеанс журналы, тілдер. Осы сөздердің бірімен сұрақ жазыңыз, мысалы «сигналдар қалай жұмыс істейді».",
  signals:"Үш сигнал бар. Сигнал 1 (көк) белгіні келесі тақтайшаға жылжытады. Сигнал 2 (жасыл) — «ИӘ»: тақтайшаны таңдау немесе фразаны растау. Сигнал 3 (сұр) — «ЖОҚ»: болдырмау. Пернетақтада немесе сыртқы ауыстырғышта бұл 1, 2 және 3 пернелері.",
  patient:"Адам тек бір сигнал бере алса, «Сөйлесу» бетінде «Науқас режимі — бір сигнал» режимін қосыңыз. Белгі тақтайшалар мен қызыл батырмалар бойынша өзі жылжиды, ал науқас қажетті тармақ жанғанда сигнал береді (бос орын, ауыстырғыш немесе үлкен батырманы түрту). Баяу жылдамдықтан бастаңыз — 2–3 секунд.",
  session:"«Сөйлесу» бетін ашып, науқасқа не айтқаныңызды жазыңыз (мысалы «Су ішкіңіз келе ме?»), тақырыпты таңдап, «Фразалар алу» батырмасын басыңыз. Науқас тақтайшаны таңдайды, қолданба «Дауыстап айту керек пе?» деп сұрайды, «ИӘ» дегеннен кейін фраза айтылып, жаңалары шығады. Профильді толтырсаңыз, фразалар дәлірек болады.",
  emergency:"Төмендегі қызыл батырмалар («Ауырып тұрмын!», «Тыныс ала алмай тұрмын!», «Мейірбикені шақырыңыз!») әрқашан көрінеді, ЖИ-ге тәуелді емес және бірден дауыстап айтылады. Науқас режимінде белгі оларды да аралайды. Нағыз қауіп болса, бірден медициналық қызметкерлерді шақырыңыз.",
  eeg:"«ЭЭГ симуляторы» қолданбаны гарнитура қалай басқаратынын көрсетеді. Қолданба виртуалды пайдаланушының ми сигналын жасайды, тақтайшалар жыпылықтайды, ал нейрожелі P300 толқыны бойынша қажетті фразаны анықтайды. Сигнал сапасын және жыпылықтау айналымдарының санын өзгертуге болады: айналым көп болса, баяу, бірақ дәлірек.",
  network:"Нейрожелі Python-да (160–64–16–1 қабаттары) БАС-пен ауыратын 8 адамның нағыз ЭЭГ жазбаларында (BNCI 008-2014, 33 600 жыпылық) оқытылған және браузердің өзінде жұмыс істейді. Калибрлеусіз жаңа науқастарда 10 қайталауда 6×6 кестедегі әріптердің 77%-ын дұрыс таңдайды; адамға калибрлегенде 91%, классикалық LDA әдісі 95%, сондықтан қысқа калибрлеу маңызды. Қолданбадағы симулятор осы науқастардың сигналдарына бейімделген.",
  profile:"«Профиль» бетінде аты-жөнін, туған күнін, жынысын, жағдайын, туыстарын, сүйікті фразалары мен тақырыптарын көрсетіңіз. Жыныс дауысты және фразалардың грамматикасын анықтайды. Құжаттар мен телефондар бөлек сақталады: оларды тек иесі мен редакторлар көреді және олар ЖИ-ге ешқашан жіберілмейді.",
  survey:"«Еріктілер сауалнамасы» — SUS ыңғайлылық шкаласы: 1-ден 5-ке дейін бағаланатын 10 тұжырым және фразалардың пайдалылығы туралы сұрақ. Жіберілгеннен кейін қолданба 0-ден 100-ге дейінгі SUS баллын көрсетеді; бағдарламалар үшін орташа нәтиже шамамен 68.",
  log:"Әр әрекет «Сеанс журналына» уақытымен, тілімен және енгізу тәсілімен жазылады. Кесте «Сөйлесу» және «ЭЭГ симуляторы» беттерінің төменгі жағында, оны «CSV экспорттау» батырмасымен сақтауға болады.",
  languages:"Тіл жоғарыдағы батырмалармен ауыстырылады: қазақша, русский, English, кыргызча. Тілмен бірге фразалар, батырмалар және дауыс өзгереді. Құрылғыда қазақ немесе қырғыз дауысы болмаса, фразаларды орыс дауысы оқиды.",
  ai:"ЖИ агенті қолданба claude.ai-да ашылып, аккаунтқа кіріп, қолданбаға Claude-қа жүгінуге рұқсат берілгенде ғана жұмыс істейді. Егер рұқсат бір рет қабылданбаса, жоғарыдағы сары жолақтағы «Claude-қа рұқсат беру» батырмасын басыңыз немесе осы қолданбаның «Рұқсаттар» мәзірінде Claude-ты қосып, бетті жаңартыңыз."},
ky:{prefix:"Орнотулган маалымдама (ЖИ азыр жеткиликсиз, себеби жогорудагы тилкеде жазылган):",
  general:"Бул темалар боюнча жардам берем: сигналдар жана бейтап режими, сеансты баштоо, шашылыш баскычтар, ЭЭГ симулятору жана нейрон тармагы, профиль жана үн, ыктыярчылар сурамжылоосу, сеанс журналы, тилдер. Ушул сөздөрдүн бири менен суроо жазыңыз, мисалы «сигналдар кантип иштейт».",
  signals:"Үч сигнал бар. Сигнал 1 (көк) белгини кийинки плиткага жылдырат. Сигнал 2 (жашыл) — «ООБА»: плитканы тандоо же фразаны ырастоо. Сигнал 3 (боз) — «ЖОК»: жокко чыгаруу. Клавиатурада же тышкы которгучта бул 1, 2 жана 3 баскычтары.",
  patient:"Адам бир гана сигнал бере алса, «Сүйлөшүү» барагында «Бейтап режими — бир сигнал» режимин күйгүзүңүз. Белги плиткалар жана кызыл баскычтар боюнча өзү жылат, ал эми бейтап керектүү пункт күйгөндө сигнал берет (боштук, которгуч же чоң баскычты басуу). Жай ылдамдыктан баштаңыз — 2–3 секунда.",
  session:"«Сүйлөшүү» барагын ачып, бейтапка эмне деп айтканыңызды жазыңыз (мисалы «Суу ичкиңиз келеби?»), теманы тандап, «Фразаларды алуу» баскычын басыңыз. Бейтап плитканы тандайт, колдонмо «Үн чыгарып айтайынбы?» деп сурайт, «ООБА» дегенден кийин фраза айтылып, жаңылары чыгат. Профилди толтурсаңыз, фразалар тагыраак болот.",
  emergency:"Төмөнкү кызыл баскычтар («Ооруп жатам!», «Дем ала албай жатам!», «Медайымды чакырыңыз!») дайыма көрүнүп турат, ЖИге көз каранды эмес жана дароо үн чыгарып айтылат. Бейтап режиминде белги алардын үстүнөн да өтөт. Чыныгы коркунуч болсо, дароо медициналык кызматкерлерди чакырыңыз.",
  eeg:"«ЭЭГ симулятору» колдонмону гарнитура кантип башкарарын көрсөтөт. Колдонмо виртуалдык колдонуучунун мээ сигналын түзөт, плиткалар жымылдайт, ал эми нейрон тармагы P300 толкуну боюнча керектүү фразаны аныктайт. Сигналдын сапатын жана жымылдоо айлампаларынын санын өзгөртсө болот: айлампа көп болсо, жайыраак, бирок тагыраак.",
  network:"Нейрон тармагы Python'до (160–64–16–1 катмарлары) БАС менен ооруган 8 адамдын чыныгы ЭЭГ жазууларында (BNCI 008-2014, 33 600 жымылдоо) окутулган жана браузердин өзүндө иштейт. Калибрлөөсүз жаңы бейтаптарда 10 кайталоодо 6×6 таблицадагы тамгалардын 77%ын туура тандайт; адамга калибрлегенде 91%, классикалык LDA ыкмасы 95%, ошондуктан кыска калибрлөө маанилүү. Колдонмодогу симулятор ушул бейтаптардын сигналдарына ылайыкталган.",
  profile:"«Профиль» барагында аты-жөнүн, туулган күнүн, жынысын, абалын, туугандарын, сүйүктүү фразаларын жана темаларын көрсөтүңүз. Жыныс үндү жана фразалардын грамматикасын аныктайт. Документтер жана телефондор өзүнчө сакталат: аларды ээси жана редакторлор гана көрөт жана алар ЖИге эч качан жөнөтүлбөйт.",
  survey:"«Ыктыярчылар сурамжылоосу» — SUS ыңгайлуулук шкаласы: 1ден 5ке чейин бааланган 10 билдирүү жана фразалардын пайдалуулугу жөнүндө суроо. Жөнөтүлгөндөн кийин колдонмо 0дөн 100гө чейинки SUS баллын көрсөтөт; программалар үчүн орточо натыйжа болжол менен 68.",
  log:"Ар бир аракет «Сеанс журналына» убактысы, тили жана киргизүү ыкмасы менен жазылат. Таблица «Сүйлөшүү» жана «ЭЭГ симулятору» барактарынын ылдый жагында, аны «CSV экспорттоо» баскычы менен сактаса болот.",
  languages:"Тил жогорудагы баскычтар менен которулат: қазақша, русский, English, кыргызча. Тил менен бирге фразалар, баскычтар жана үн өзгөрөт. Түзмөктө казак же кыргыз үнү жок болсо, фразаларды орус үнү окуйт.",
  ai:"ЖИ агенти колдонмо claude.ai'да ачылып, аккаунтка кирип, колдонмого Claude'га кайрылууга уруксат берилгенде гана иштейт. Эгер уруксат бир жолу четке кагылса, жогорудагы сары тилкедеги «Claude'га уруксат берүү» баскычын басыңыз же ушул колдонмонун «Уруксаттар» менюсунда Claude'ду күйгүзүп, баракты жаңыртыңыз."}
};

const FAQ_ADD={
ru:{emergency:"Нажатие красной кнопки включает громкую сирену и тревогу на всех устройствах, где открыто приложение. На телефоне сиделки нажмите «Сиделка» вверху, тогда тревога придёт со звуком; кнопка «Иду!» подтверждает её, и пациент слышит «Сиделка идёт».",
  patient:"Кнопка «Автоподбор скорости» сама замедляет сканирование после отмен и пропусков и ускоряет его после трёх быстрых выборов подряд.",

en:{emergency:"A red button also sounds a loud siren and raises an alarm on every device where the app is open. On the caregiver’s phone press “Caregiver” at the top so alarms come with sound; “I’m coming” confirms it and the patient hears “The caregiver is coming”.",

kk:{emergency:"Қызыл батырма қатты сирена қосып, қолданба ашық тұрған барлық құрылғыға дабыл жібереді. Күтушінің телефонында жоғарыдағы «Күтуші» батырмасын басыңыз, сонда дабыл дыбыспен келеді; «Келе жатырмын!» оны растайды, ал науқас «Күтуші келе жатыр» деп естиді.",
  patient:"«Жылдамдықты автоматты таңдау» болдырмау мен өткізіп алудан кейін сканерлеуді баяулатады, қатарынан үш жылдам таңдаудан кейін жылдамдатады.",
  session:"«↻ Жиі айтады» тақырыбы сеанс журналы бойынша адам ең жиі таңдаған фразаларды көрсетеді.",

function faqAnswer(q){
  const t=" "+q.toLowerCase()+" ";
  let best=null, bs=0;
  for(const k in FAQ_KEYS){ const sc=FAQ_KEYS[k].filter(w=>t.includes(w)).length; if(sc>bs){ bs=sc; best=k } }
  const F=FAQ[S.lang]||FAQ.en;
  return F.prefix+"\n\n"+(best?F[best]:F.general);
}

/* ---------------- Assistant ---------------- */
const ASST_RULES=()=>`You are the AI Agent inside Neuro-Relay, a communication app for people who cannot speak (ALS, stroke, locked-in syndrome). You help CAREGIVERS and volunteers use the app. Answer in ${LANG_FULL[S.lang]}${S.lang==="kk"||S.lang==="ky"?" (Cyrillic)":""}, briefly (under 120 words), in plain friendly language, with short numbered steps when useful. No markdown headers.
How the app works:
- Page 1 "Talk": caregiver types what they said into "What did the other person say?", picks a topic (General, Food & Drink, How I feel, Family, Rest) and presses "Get phrases". The AI suggests 5 short phrases (max 8 words) shown as big numbered tiles 1–5 plus a "More phrases" tile. The patient chooses by touching a tile, or with signals: Signal 1 (blue) moves the highlight to the next tile, Signal 2 (green) = YES/choose, Signal 3 (grey) = NO/cancel. A box asks "Say this out loud?"; YES speaks the phrase with text-to-speech and shows it in the big "Spoken" box, then new phrases load; NO cancels. Signals can come from any switch: a button, eye blink switch, or an EEG headset.
- "Patient mode — one switch" (toggle on the Talk page) is for paralysed users: the highlight moves automatically over tiles 1–5, "More phrases" and the three emergency buttons at the chosen scan speed (1–3 s). The user gives ONE signal (Space key, any switch that acts as a keyboard key such as a blink, eyebrow, sip-and-puff or finger switch, or a tap on the big SWITCH button) when the wanted item is lit. In the "Say this out loud?" box YES and NO are highlighted in turn; no signal for 3 cycles counts as NO. Stats show messages, average time per message, switch presses and cancellations. For volunteer tests, the person playing the patient may use only that one signal. Start with a slow speed (2–3 s) and speed up as the user gets comfortable.
- Eye tracking: on the Talk page turn on "Eye tracking (look to select)". It works with eye trackers that move the pointer to where the person looks (Tobii, Windows Eye Control, head mice); a mouse works for testing. Holding the gaze on a tile for the chosen dwell time (0.8–3 s, start with 1.5–2 s) fills a yellow bar and selects it; YES/NO in "Say this out loud?" work the same way; red emergency buttons need 1.5× the dwell time to avoid accidental alarms; to choose the same item again, look away and back. It replaces patient scanning mode (only one is on at a time). Stats show messages by gaze and average time per message. Webcam eye tracking: in the downloaded app file opened in Chrome or Edge (the camera is blocked inside claude.ai), press "Turn on camera (eye tracking)"; allow the camera; a small window in the corner shows the face with the eyes outlined and the irises marked, a status (eyes found / face not found / eyes closed) and eye-openness bars. Face recognition (Google MediaPipe Face Landmarker) runs locally in the browser and is downloaded once (~4 MB, needs internet the first time); the video never leaves the device. A long blink (0.5–3 s) works immediately as a selection: in patient mode it is the switch, in gaze mode it selects the looked-at tile at once, and it answers YES in "Say this out loud?". For control by gaze press "Calibrate gaze" and look at 9 dots while keeping the head still; then a yellow dot follows the gaze and dwell selection works. Webcam gaze is less precise than a dedicated eye tracker: sit facing the camera in good light, recalibrate if the head moves, and keep the dwell time at 1.5–2 s.
- Emergency alarm: pressing a red button (by touch or by the patient's switch) speaks the phrase, plays a loud siren that repeats every 15 s, flashes a full-screen red alarm and sends the alarm live to every device where the app is open (it is shared through the app's database). On the caregiver's own phone they open the same app link and press "Caregiver" at the top: this keeps the alarm sound ready and the screen awake (tap the screen once after opening so sound is allowed). The caregiver presses "I'm coming" to accept; the patient's device then chimes and says "The caregiver is coming". Someone at the patient's side can press "Cancel alarm". This is not a certified nurse-call system: the caregiver's page must be open, and other devices get the alarm only when the shared connection works.
- "Auto speed" in patient mode adjusts the scan speed from the patient's results: 20% slower after a cancel (NO) or a timeout, 10% slower when the patient waited more than 2.5 scan cycles for the tile, 10% faster after three quick YES choices in a row; limits 0.8–4 s; every change is written to the Session Log.
- Phrase suggestions use the Session Log history: a topic "↻ Often said" lists the phrases this person chose most often (recent ones and ones chosen at the same time of day count more); one such phrase is mixed into built-in tiles and the AI is told the most frequent ones.
- Downloaded copy: inside claude.ai the AI Agent uses Claude through the viewer. A copy of the app downloaded and opened from disk or hosted elsewhere has no viewer, so the AI Agent page shows an "AI key" card: paste either a free Gemini key from aistudio.google.com/apikey (starts with AIza) or a paid Claude key from console.anthropic.com → API Keys (starts with sk-ant-), press "Save and check"; the app detects which service it is. On the free Gemini tier Google may use requests to improve its products, so do not enter real patient names or diagnoses. The key stays only in that browser. In a downloaded copy the session log, profile and alarms are stored only on that device (no sharing between devices).
- Voices: the app uses the device's text-to-speech voices. For Kyrgyz, without a Kyrgyz voice it uses the closely related Kazakh voice, then Russian; for Kazakh, Kazakh then Kyrgyz then Russian. Kazakh neural voices (Aigul, Daulet) are usually available in the Microsoft Edge browser; ordinary browsers have no Kyrgyz voice. The Spoken box shows which voice language was used.
- Red emergency buttons are always at the bottom ("I'm in pain!", "I can't breathe!", "Call the nurse!"); they are fixed, not AI-generated, and speak immediately. In a real emergency, always also get a person / call medical help.
- Every action is saved with time, language and input method in the "Session Log" table, which can be exported as CSV.
- Page 2 "EEG Simulator" demonstrates how a brain headset would control the app, using a REAL neural network. A Python project (scikit-learn MLP, layers 160-64-16-1) was trained on P300 EEG (currently real EEG recordings of 8 people with ALS from the open BNCI 008-2014 dataset (Riccio et al., 2013), 33,600 flashes; on new patients without calibration 77% of letters right in a 6×6 table with 10 repetitions (AUC 0.77); with per-person calibration 91%; the classic LDA method with calibration 95%, so a short per-person calibration matters; in ALS the P300 is weak (about 1–3 µV, around 450 ms) with a strong occipital negativity around 280 ms). Its weights are embedded in the app and the network runs in the browser with the same filter and features as Python (answers match to 0.000001). For each attempt the app generates a realistic 8-channel EEG signal (background brain activity, alpha rhythm, blinks, 50 Hz noise, P300 after the wanted phrase) for a virtual user, shows Fz/Cz/Pz/Oz live on the EEG monitor (orange marks = flashes of the wanted phrase, the P300 wave is visible on Pz about 300 ms later), and the network scores every flash; evidence bars show its estimate per tile after each round. "Signal quality" (good / medium / weak) sets the virtual user's P300 size and noise; "New user" draws another person. With the 5 tiles at 5 rounds expect about 93% correct with good signal, 85% medium, 55% weak. Mode "P300 (automatic)": choose the wanted phrase or Random, choose 3/5/8 rounds, "Simulate one message" or "Run continuously"; the YES/NO confirmation is still a simplified 95%-reliable simulation. The EEG monitor is live: the virtual person's EEG streams continuously and their state changes every second (Attention and Fatigue meters; low attention weakens the P300 and causes missed flashes, fatigue grows during work, recovers at rest and raises the alpha rhythm). Each virtual user also has an individual brain "signature" (P300 stronger on some channels, an extra personal response), like real patients. "Adapt the network to this person" (on by default): after every confirmed choice a small personal layer (shrinkage LDA) learns this person's P300 next to the general network and its weight grows with the examples; the line under the switch compares the general network with the adapted one over the last choices; "New user" resets it. In the simulator it raises accuracy by roughly 8–19 points after about 10 choices; on real ALS patients the network had not seen it gave +0 to +10 points (about +4 on average), never worse. Mode "Sentence (any words)": type any sentence (or pick an example) and press "Compose with EEG"; for each word 5 tiles show the wanted word plus 4 other words suggested by the AI as likely next words (built-in word list if the AI is unavailable); the network picks the word from the EEG, a simulated YES/NO confirms it (up to 3 attempts, otherwise the word is skipped), the sentence builds up word by word (red = wrong word confirmed by mistake) and is spoken at the end with words-per-minute stats; if the AI did not predict the word, on a real device it would be spelled letter by letter. "Start the AI patient" (in Sentence mode): the same AI as this AI Agent (Claude inside claude.ai; Gemini or Claude with the user's key in a downloaded copy) plays the virtual person over the internet: it decides what they want to say (new topic each time, using the non-private profile), the wrong word options for the tiles, and their attention and fatigue for every second of the next minute with short reasons (e.g. distracted by noise), shown under the monitor; the app turns that into EEG and the neural network decodes it locally in the browser; one AI request per sentence; without AI the built-in model drives the person. Mode "Step by step": press "User is thinking about phrase N" and the network decides; answer EEG YES/NO by hand. "Check a real recording": choose eeg.csv (channels Fz, Cz, P3, Pz, P4, PO7, PO8, Oz at 250 Hz, column time_s) and events.csv (time_s, selection, round, tile; optional target_tile, is_target) together; the network decodes each selection and, if targets are present, shows accuracy. "Download a sample recording" saves such a pair of files. Counters: selections, messages, selections per message, average time per message, speed in bits/min, errors caught by NO. Real headsets (OpenBCI, Emotiv, g.tec) need time-synchronised flash markers, usually via Lab Streaming Layer, and the network should be retrained on real recordings with the Python project (train.py, then export_web.py).
- Page 4 "User Profile": last name, first name, patronymic, date of birth, sex (female/male), condition; Voice (automatic by sex or a chosen voice from the device, speed, Listen button — if the device has no voice of that sex for the language, the pitch is shifted); Favourites (favourite topics, own topics that become topic buttons on the Talk page, favourite phrases that appear under "★ Favourites" on the Talk page, favourite things). A private section "Documents and contacts" holds country/region/city, passport number, IIN/PIN, medical record number, email, hospital, department/room, hospital phone, attending doctor and phone, and relatives with phone numbers. Only the account owner and editors can see the private section, and it is never sent to the AI; the AI only uses name, sex, age, condition, relatives' names and relations, and favourites. Sex also makes suggested phrases grammatically correct (e.g. Russian устал/устала).
- Page 5 "Volunteer Survey": System Usability Scale (10 statements, 1–5) plus phrase usefulness and a comment; it shows the SUS score.
- Language buttons at the top: Kazakh, Russian, English, Kyrgyz. Speech uses the device's voices; if no Kazakh/Kyrgyz voice is installed, a Russian voice is used.
Never give medical diagnoses; suggest contacting medical staff for medical questions.`;
function renderChat(){
  const c=$("#chat");
  const msgs=[{role:"assistant",content:T("asstHello")},...S.chat];
  c.innerHTML=msgs.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}${m.thinking?" thinking":""}">${esc(m.content)}</div>`).join("");
  c.scrollTop=c.scrollHeight;
  $("#quickQs").innerHTML=["q1","q2","q3"].map(k=>`<button type="button">${esc(T(k))}</button>`).join("");
  $$("#quickQs button").forEach(b=>b.onclick=()=>{$("#chatInput").value=b.textContent; askAssistant()});
}
let chatBusy=false;
async function askAssistant(){
  const q=$("#chatInput").value.trim(); if(!q||chatBusy) return;
  $("#chatInput").value=""; chatBusy=true;
  S.chat.push({role:"user",content:q});
  const reply={role:"assistant",content:T("asstThinking"),thinking:true}; S.chat.push(reply); renderChat();
  if(!(await ensureSample())){ reply.content=faqAnswer(q); reply.thinking=false; reply.offline=true; renderChat(); chatBusy=false; return }
  const turns=S.chat.filter(m=>m!==reply&&!m.thinking&&!m.offline).slice(-10).map(m=>({role:m.role,content:m.content}));
  try{
    const bubbleIdx=S.chat.length-1;
    const text=await aiChat(ASST_RULES(), turns, ({text})=>{reply.content=text; reply.thinking=false; const el=$$("#chat .msg")[bubbleIdx+1]; if(el){el.textContent=text; el.classList.remove("thinking"); $("#chat").scrollTop=1e9}});
    reply.content=text; reply.thinking=false;
    if(S.ai!=="ready"){ S.ai="ready"; renderAiBanners() }
  }catch(e){
    if(aiFail(e)){ reply.content=faqAnswer(q); reply.offline=true }
    else if(e&&e.code==="api_network"){ reply.content=T("ai_net"); reply.offline=true }
    else if(e&&e.code==="api_region"){ reply.content=T("ai_region"); reply.offline=true }
    else { reply.content=(e&&e.text)||(T("asstErr")+(e&&e.message&&String(e.code||"").startsWith("api")?" ("+e.message+")":"")); if(!(e&&e.text)) reply.offline=true }
    reply.thinking=false;
  }
  chatBusy=false; renderChat();
}
$("#chatForm").addEventListener("submit",e=>{e.preventDefault(); askAssistant()});

/* ---------------- Profile ---------------- */
// Two documents:
//  profile/main     — what the AI may use (name, sex, condition, favourites, relatives' names). Readable by everyone admitted to the page.
//  private/patient  — documents, location, hospital, phones, email. Only the owner and editors can read or write it (db rule).
const PUB={pLast:"lastName", pFirst:"firstName", pMiddle:"middleName", pBirth:"birthDate", pCond:"cond", pCustomTopics:"customTopics", pFreq:"freq", pFav:"fav"};
const PRIV={pCountry:"country", pRegion:"region", pCity:"city", pPassport:"passport", pPersonalId:"personalId", pMedRecord:"medRecord", pEmail:"email", pHospital:"hospital", pWard:"ward", pHospPhone:"hospPhone", pDoctor:"doctor", pDoctorPhone:"doctorPhone"};
S.priv={}; S.privAccess="local";   // "local" (no account store), "owner" (can read/write), "locked" (cannot)
let formGender="", formFavTopics=[], formRels=[];
function ageFrom(d){ if(!d) return ""; const b=new Date(d); if(isNaN(b)) return ""; const n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate())) a--; return a>=0&&a<130?a:"" }
function migrateProfile(p){
  p=Object.assign({},p||{});
  if(p.name && !p.firstName){ p.firstName=p.name }
  if(!p.relatives && p.family){ p.relatives=p.family.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^(.*?)\s*\((.*)\)\s*$/); return m?{name:m[1],rel:m[2]}:{name:s,rel:""}}) }
  return p;
}
function fillProfile(){
  const p=S.profile, q=S.priv;
  for(const id in PUB){ const el=$("#"+id); if(document.activeElement!==el) el.value=p[PUB[id]]||"" }
  for(const id in PRIV){ const el=$("#"+id); if(document.activeElement!==el) el.value=q[PRIV[id]]||"" }
  formGender=p.gender||""; formFavTopics=(p.favTopics||[]).slice();
  // Relatives: names come from the shared profile, phones from the private document (matched by position).
  const pubR=p.relatives||[], privR=q.relatives||[];
  const n=Math.max(pubR.length, privR.length);
  formRels=[]; for(let i=0;i<n;i++) formRels.push({name:(privR[i]&&privR[i].name)||(pubR[i]&&pubR[i].name)||"", rel:(privR[i]&&privR[i].rel)||(pubR[i]&&pubR[i].rel)||"", phone:(privR[i]&&privR[i].phone)||""});
  if(!formRels.length) formRels.push({name:"",rel:"",phone:""});
  $("#pRate").value=p.rate||.95;
  renderProfileDynamic();
}
function renderProfileDynamic(){
  $$("#pGender button").forEach(b=>b.setAttribute("aria-checked", b.dataset.g===formGender));

}
function renderRels(){

}
function renderDocsAccess(){

function renderVoiceSelect(){

$("#pVoice").addEventListener("change",e=>{ S.profile.voiceURI=e.target.value; renderVoiceSelect() });

$("#relAdd").onclick=()=>{ formRels.push({name:"",rel:"",phone:""}); renderRels(); const ins=$$("#relList input[data-f='name']"); ins[ins.length-1]&&ins[ins.length-1].focus() };

$("#profileForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const p={}; for(const id in PUB) p[PUB[id]]=$("#"+id).value.trim();
  p.gender=formGender; p.favTopics=formFavTopics.slice();
  p.voiceURI=$("#pVoice").value; p.rate=+$("#pRate").value;
  const rels=formRels.map(r=>({name:r.name.trim(), rel:r.rel.trim(), phone:(r.phone||"").trim()})).filter(r=>r.name||r.phone);
  p.relatives=rels.map(r=>({name:r.name, rel:r.rel}));
  p.updated=new Date().toISOString();
  const q={}; for(const id in PRIV) q[PRIV[id]]=$("#"+id).value.trim();
  q.relatives=rels; q.updated=p.updated;
  S.profile=p; lsSet("nr.profile", JSON.stringify(p));
  let msg;
  if(db){
    let pubOk=false, privOk=false;
    try{ await db.doc("profile/main").set(p); pubOk=true }catch(err){}
    if(S.privAccess!=="locked"){ try{ await db.doc("private/patient").set(q); privOk=true; S.priv=q }catch(err){} }
    msg=pubOk&&(privOk||S.privAccess==="locked")?(S.privAccess==="locked"?T("savedPartial"):T("saved")):pubOk?T("savedPartial"):T("savedLocal");
    if(!pubOk) lsSet("nr.profile", JSON.stringify(p));
  } else {
    S.priv=q; lsSet("nr.private", JSON.stringify(q)); msg=T("savedLocal");
  }
  $("#profileSaved").textContent=msg;
  renderTopics(); renderVoiceSelect();
  setTimeout(()=>$("#profileSaved").textContent="",4500);
});

/* ---------------- Survey ---------------- */
function scaleHtml(key, val, lo, hi){
  return `<div class="scale" role="group">${[1,2,3,4,5].map(v=>`<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${val===v}">${v}</button>`).join("")}</div><div class="scale-ends"><span>1 · ${esc(lo)}</span><span>${esc(hi)} · 5</span></div>`;
}
function renderSurvey(){
  const sus=T("sus");
  $("#susList").innerHTML=sus.map((s,i)=>`<div class="sus-item"><p><b>${i+1}.</b>${esc(s)}</p>${scaleHtml("s"+i,S.survey.sus[i],T("disagree"),T("agree"))}</div>`).join("");
  $("#usefulItem").innerHTML=`<p><b>11.</b>${esc(T("useful"))}</p>${scaleHtml("u",S.survey.useful,T("notUseful"),T("veryUseful"))}`;
  $$("#surveyForm .scale button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, v=+b.dataset.v;
    if(k==="u") S.survey.useful=v; else S.survey.sus[+k.slice(1)]=v;
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  });
}
$("#surveyForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const a=S.survey.sus;
  if(a.some(v=>!v)||!S.survey.useful){ $("#survMsg").textContent=T("incomplete"); $("#survMsg").style.color="var(--red)"; return }
  let sum=0; a.forEach((v,i)=>sum+= i%2===0 ? v-1 : 5-v);
  const score=Math.round(sum*2.5*10)/10;
  const row={ts:Date.now(), iso:new Date().toISOString(), session:SESSION, lang:S.lang, sus:a.slice(), susScore:score, phraseUsefulness:S.survey.useful, comment:$("#survComment").value.trim()};
  if(db){ try{ await db.collection("survey").add(row) }catch(err){ lsSet("nr.survey."+row.ts, JSON.stringify(row)) } } else lsSet("nr.survey."+row.ts, JSON.stringify(row));
  $("#survMsg").style.color=""; $("#survMsg").textContent=T("thanks",{s:score});
  S.survey={sus:Array(10).fill(0), useful:0}; $("#survComment").value=""; renderSurvey();
});

/* ---------------- i18n render + routing ---------------- */
function applyLang(){
  document.documentElement.lang=S.lang;
  $$("[data-i]").forEach(el=>el.textContent=T(el.dataset.i));
  $$("#langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  $("#otherSaid").placeholder=T("otherPh"); $("#chatInput").placeholder=T("asstPh");
  renderTopics(); renderEmergency(); renderFlow(); renderEeg(); renderChat(); renderSurvey(); renderLogs(); renderTiles();
  renderModes(); renderP3Targets(); p3Buttons(); renderPmStats(); applyScanHl(); renderProfileDynamic();
  renderQuality(); renderVuser(); renderNetFacts(); renderAiBanners(); renderPmAuto(); renderAlert(); renderApiCard(); renderCamUI(); $("#wave").setAttribute("aria-label",T("monAria")); if(MON.filt && !$("#page-eeg").hidden) drawMonitor();
  if(!S.p3.running) p3Status(esc(T("p3Idle")));
  renderSentence(); renderAdapt(); renderMind(); aiPatientButtons(); renderBrainSrc();
  $("#confirmHint").textContent=S.pm.on?T("pmConfirmHint"):T("confirmHint");
}
$$("#langs button").forEach(b=>b.onclick=()=>{
  if(S.lang===b.dataset.lang) return;
  S.lang=b.dataset.lang; lsSet("nr.lang",S.lang);
  if(S.source!=="ai"){ S.phrases=bankPhrases(false) }
  applyLang();
  if(S.source==="ai" && !$("#page-talk").hidden) fetchPhrases(false,"touch");
});
const PAGES=["talk","eeg","assistant","profile","survey"];
function route(){
  const h=(location.hash||"#talk").slice(1); const p=PAGES.includes(h)?h:"talk";
  PAGES.forEach(x=>$("#page-"+x).hidden=x!==p);
  $$("nav.tabs a").forEach(a=>a.toggleAttribute("aria-current",false)); $(`nav.tabs a[data-page="${p}"]`).setAttribute("aria-current","page");
  if(p==="eeg"){ sizeWave(); renderMind(); if(!S.p3.running&&!S.sent.running&&!MON.live) liveStart(); else drawMonitor() }
  else liveStop();
}
window.addEventListener("hashchange",route);
window.addEventListener("resize",()=>{ if(!$("#page-eeg").hidden){ sizeWave(); drawMonitor() } });

$("#getBtn").onclick=()=>fetchPhrases(false,"touch");
$("#otherSaid").addEventListener("keydown",e=>{ if(e.key==="Enter") fetchPhrases(false,"touch") });
$("#sig1").onclick=()=>signal(1); $("#sig2").onclick=()=>signal(2); $("#sig3").onclick=()=>signal(3);
$("#cYes").onclick=()=>confirmYes(); $("#cNo").onclick=()=>confirmNo();
// Keyboard switches: 1/2/3 act as signals on the Talk page (common for adapted switches)
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")) return;
  if($("#page-talk").hidden) return;
  if(S.pm.on){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!e.repeat) switchPress() } return }
  if(e.key==="1"||e.key==="2"||e.key==="3"){ e.preventDefault(); signal(+e.key) }
  if(e.key==="Escape" && !$("#confirm").hidden) confirmNo("signal");
});

try{ S.priv=JSON.parse(lsGet("nr.private")||"{}")||{} }catch(e){ S.priv={} }

if(lsGet("nr.caregiver")==="1"){ setCaregiver(true,true); setTimeout(()=>toast(T("cgArm")),800) }
S.gaze.dwell=+(lsGet("nr.gazeDwell")||1500)||1500; $("#gazeDwell").value=String(S.gaze.dwell);
fillProfile(); applyLang(); route();
if(lsGet("nr.gaze")==="1") setGaze(true);

(async()=>{
  if(!window.claude||!window.claude.use){ S.ai=apiKey()?"ready":"standalone"; renderAiBanners(); renderApiCard(); return }
  // Each capability connects on its own, so the AI is ready as soon as possible.
  samplePromise=claude.use("sample").catch(()=>null).then(s=>{ sample=s; S.ai=s?"ready":"none"; renderAiBanners(); checkAiDenied(); return s });
  claude.use("permissions").then(p=>{ perms=p; checkAiDenied() }).catch(()=>{});
  claude.use("downloads").then(dl=>{ downloads=dl; renderLogs() }).catch(()=>{});
  const d=await claude.use("db").catch(()=>null);
  if(d){
    db=d;
    let timer=setTimeout(()=>{ if(!S.shared){ db=null; renderLogs() } },10000);
    db.collection("log").orderBy("ts","desc").limit(300).onSnapshot(snap=>{
      clearTimeout(timer); S.shared=true;
      S.log=snap.docs.map(x=>x.data());
      renderLogs();
    },()=>{ clearTimeout(timer); db=null; S.shared=false; renderLogs() });
    db.doc("alerts/current").onSnapshot(snap=>{
      if(!snap.exists) return; const a=snap.data();
      if(a.status==="active" && Date.now()-a.ts>10*60*1000) return;   // ignore stale alarms
      applyAlert(a, true);
    },()=>{});
    db.doc("profile/main").onSnapshot(snap=>{
      if(snap.exists){ S.profile=migrateProfile(snap.data()); lsSet("nr.profile",JSON.stringify(S.profile)); fillProfile(); renderTopics() }
    },()=>{});
    // Private data lives only in the account, never in this browser's storage.
    let canEdit=false;
    try{ const u=await claude.use("user"); canEdit=u?await u.canEdit():false }catch(e){}
    S.privAccess=canEdit?"owner":"locked";
    if(canEdit){
      const local=S.priv; S.priv={};
      db.doc("private/patient").onSnapshot(snap=>{
        if(snap.exists){ S.priv=Object.assign({},snap.data()); fillProfile() }
        else if(Object.keys(local).length){ S.priv=local; fillProfile() }   // offer earlier local entries to save once
      },()=>{ S.privAccess="locked"; renderDocsAccess() });
      try{ localStorage.removeItem("nr.private") }catch(e){}
    } else { S.priv={} }
    fillProfile();
  }
  renderLogs();
})();
</script>
