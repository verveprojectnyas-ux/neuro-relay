<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuro-Relay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm teal ground; frosted white panels; huge tiles; signal rail on the right; emergency bar pinned to the bottom edge.
   Deliberately single-theme (light), as specified: high contrast on a soft teal gradient. */
:root{
  color-scheme: light;
  /* Clinical palette: icy blue ground, white cards, deep teal actions, navy type */
  --bg-1:#eef7fa; --bg-2:#d9edf3; --bg-3:#e5f3f7;
  --glass:#ffffff; --glass-strong:#ffffff; --glass-edge:#e3eff3;
  --ink:#10283a; --ink-2:#3c5668; --ink-3:#6b8494;
  --teal:#1f7f8e; --teal-dark:#176674; --teal-soft:#e3f2f6; --line:#d5e6ec;
  --band-1:#8fcbd8; --band-2:#3f97a9;
  --blue:#2a6fae; --blue-soft:#e4eff8;
  --green:#1f8a5e; --green-soft:#e2f4ec;
  --grey:#687c88; --grey-soft:#edf2f5;
  --red:#cf3434; --red-dark:#a62525;
  --focus:#f2b705;
  --target:#d9661c;
  --shadow:0 10px 28px rgba(31,95,120,.09), 0 2px 6px rgba(31,95,120,.05);
  --r-xl:26px; --r-lg:20px; --r-md:14px;
  --f-display:"Nunito", "Noto Sans", system-ui, sans-serif;
  --f-body:"Noto Sans", "Nunito", system-ui, sans-serif;
  --emerg-h:96px;
}
*{box-sizing:border-box}
html{background:var(--bg-1)}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:var(--f-body); font-size:18px; line-height:1.45;
  background:
    radial-gradient(1100px 600px at 85% -5%, #ffffff 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-3) 0%, var(--bg-1) 40%, var(--bg-2) 100%);
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(var(--emerg-h) + 28px + env(safe-area-inset-bottom, 0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--focus); outline-offset:3px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
.wrap{max-width:1180px; margin:0 auto}

/* Header */
header.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; padding:12px 14px 12px 18px; background:#fff; border:1px solid var(--glass-edge); border-radius:var(--r-xl); box-shadow:var(--shadow)}
.brand{display:flex; align-items:center; gap:12px}
.brand-mark{width:48px; height:48px; border-radius:16px; background:linear-gradient(135deg,var(--band-1),var(--teal)); display:grid; place-items:center}
.brand-mark svg{width:30px; height:30px}
.brand h1{font-size:26px; font-weight:900; color:var(--ink)}
.brand small{display:block; font-family:var(--f-body); font-size:14px; color:var(--ink-3); font-weight:500; letter-spacing:0}
.langs{display:flex; flex-wrap:wrap; gap:4px; padding:5px; background:var(--teal-soft); border-radius:999px}
.langs button{min-height:48px; padding:0 18px; border:0; border-radius:999px; background:transparent; font-weight:700; font-size:17px; color:var(--ink-2)}
.langs button[aria-pressed="true"]{background:var(--teal); color:#fff}

nav.tabs{display:flex; gap:8px; overflow-x:auto; padding-block:14px 16px; scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto; display:flex; align-items:center; gap:8px; min-height:52px; padding:0 22px; border-radius:999px; text-decoration:none; color:var(--ink-2); font-weight:700; font-family:var(--f-display); font-size:18px; background:rgba(255,255,255,.6); border:1px solid var(--glass-edge)}
nav.tabs a .n{font-size:13px; font-family:var(--f-body); opacity:.7}
nav.tabs a:hover{background:#fff}
nav.tabs a[aria-current="page"]{background:var(--teal); color:#fff; border-color:var(--teal); box-shadow:0 6px 16px rgba(31,127,142,.25)}

/* Cards: clean white, soft shadow */
.card{background:var(--glass); border:1px solid var(--glass-edge); border-radius:var(--r-xl); box-shadow:var(--shadow); padding:22px}
.card h2{font-size:24px; font-weight:800; margin-bottom:12px}
.label{display:block; font-weight:700; font-size:17px; margin-bottom:8px; color:var(--ink)}
.muted{color:var(--ink-3)}
.eyebrow{font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--teal)}

input[type=text],input[type=number],textarea,select{width:100%; min-height:58px; padding:14px 18px; border-radius:var(--r-md); border:2px solid var(--line); background:#fff; font-size:20px; color:var(--ink)}
textarea{min-height:110px; resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--teal); outline:none; box-shadow:0 0 0 4px rgba(31,127,142,.18)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:60px; padding:0 30px; border-radius:999px; border:0; font-weight:800; font-family:var(--f-display); font-size:20px}
.btn-primary{background:var(--teal); color:#fff; box-shadow:0 6px 16px rgba(31,127,142,.28)}
.btn-primary:hover{background:var(--teal-dark)}
.btn-ghost{background:#fff; color:var(--teal); border:2px solid var(--teal)}
.btn-ghost:hover{background:var(--teal-soft)}
.btn:disabled{opacity:.55; cursor:default}

.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{min-height:54px; padding:0 22px; border-radius:999px; border:2px solid var(--line); background:#fff; font-weight:700; font-size:18px; color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:#fff}

.page[hidden],[hidden]{display:none!important}
.stack{display:flex; flex-direction:column; gap:18px}

/* Talk page */
.talk{display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:18px; align-items:start}
.ask-row{display:grid; grid-template-columns:minmax(0,1fr); gap:14px}
.ask-actions{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.source-note{font-size:15px; color:var(--ink-3)}
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.tile{position:relative; display:flex; align-items:center; gap:16px; min-height:112px; padding:18px 20px; border-radius:var(--r-lg); border:3px solid transparent; background:var(--glass-strong); box-shadow:var(--shadow); text-align:left; font-family:var(--f-display); font-weight:800; font-size:26px; line-height:1.2; color:var(--ink); transition:transform .12s, border-color .12s}
.tile:hover{transform:translateY(-2px)}
.tile .num{flex:0 0 auto; width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:var(--teal-soft); color:var(--teal); font-size:26px; font-weight:900}
.tile .txt{min-width:0; overflow-wrap:anywhere}
.tile{border-color:var(--glass-edge)}
.tile.more{background:var(--teal-soft); border:3px dashed #b8d9e2; color:var(--teal); font-size:22px}
.tile.more .num{background:transparent; border:2px solid var(--teal)}
.tile.focused{border-color:var(--focus); box-shadow:0 0 0 6px rgba(242,183,5,.3), var(--shadow); transform:scale(1.015)}
.tile.loading .txt{color:var(--ink-3)}
.tiles.busy .tile:not(.more) .txt{opacity:.35}

.signals{position:sticky; top:16px; display:flex; flex-direction:column; gap:14px}
.sig{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:2px; min-height:118px; padding:16px 20px; border:0; border-radius:var(--r-lg); color:#fff; text-align:left; box-shadow:var(--shadow); transition:transform .1s, filter .1s}
.sig:active{transform:scale(.98)}
.sig b{font-family:var(--f-display); font-size:24px; font-weight:900; line-height:1.15}
.sig span{font-size:15px; opacity:.92}
.sig-1{background:var(--blue)} .sig-2{background:var(--green)} .sig-3{background:var(--grey)}
.sig.pulse{animation:pulse .35s}
@keyframes pulse{50%{filter:brightness(1.25); transform:scale(1.03)}}

.spoken{display:flex; flex-direction:column; gap:6px; border-radius:var(--r-xl); padding:22px 26px; background:linear-gradient(115deg,var(--band-1) 0%,var(--band-2) 70%,#2f8496 100%); color:#fff; box-shadow:0 12px 30px rgba(63,151,169,.3)}
.spoken .eyebrow{color:#ffffff; opacity:.9}
.spoken .said{text-shadow:0 1px 2px rgba(16,40,58,.18)}
.spoken .said{font-family:var(--f-display); font-size:clamp(30px,5vw,46px); font-weight:900; line-height:1.15; overflow-wrap:anywhere}
.spoken .said.empty{opacity:.55; font-size:22px; font-weight:700}
.spoken .meta{font-size:15px; opacity:.85}

/* Confirm overlay */
.overlay{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:20px; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px)); background:rgba(16,40,58,.4); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.confirm{width:min(640px,100%); background:var(--glass-strong); border-radius:var(--r-xl); padding:28px; box-shadow:0 30px 70px rgba(0,0,0,.25); text-align:center; border:1px solid var(--glass-edge)}
.confirm h3{font-size:24px; color:var(--ink-2); font-weight:800}
.confirm .phrase{margin:18px 0 24px; font-family:var(--f-display); font-size:clamp(32px,6vw,48px); font-weight:900; line-height:1.15; color:var(--ink); overflow-wrap:anywhere}
.confirm .yn{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.yn button{min-height:88px; border:0; border-radius:999px; color:#fff; font-family:var(--f-display); font-weight:900; font-size:32px}
.yn .y{background:var(--green)} .yn .n{background:var(--grey)}
.confirm .hint{margin-top:14px; font-size:15px; color:var(--ink-3)}

/* Emergency */
.emergency{position:fixed; left:0; right:0; bottom:0; z-index:30; padding-top:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); background:rgba(255,255,255,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--glass-edge); box-shadow:0 -8px 24px rgba(31,95,120,.08)}
.emergency .inner{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:auto repeat(3,minmax(0,1fr)); gap:10px; align-items:center}
.emergency .tag{font-family:var(--f-display); font-weight:900; color:var(--red); font-size:15px; text-transform:uppercase; letter-spacing:.08em; writing-mode:horizontal-tb}
.em{min-height:72px; border:0; border-radius:999px; background:var(--red); color:#fff; font-family:var(--f-display); font-weight:900; font-size:21px; line-height:1.15; padding:8px 16px; box-shadow:0 6px 16px rgba(207,52,52,.28)}
.em:hover{background:var(--red-dark)}
.em.flash{animation:flash .5s 3}
@keyframes flash{50%{background:#ff3b3b; transform:scale(1.03)}}

/* Log table */
.log-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
.log-head h2{margin:0}
.table-wrap{overflow-x:auto; border-radius:var(--r-md); border:1px solid var(--line); background:#fff; max-height:420px; overflow-y:auto}
table{border-collapse:collapse; width:100%; font-size:15px; font-variant-numeric:tabular-nums}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid #e6f0f3; vertical-align:top}
th{position:sticky; top:0; background:#f1f8fa; font-weight:700; color:var(--ink-2); white-space:nowrap; z-index:1}
td.t{white-space:nowrap; color:var(--ink-3)}
.pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap}
.p-shown{background:#eef3f4; color:#3d5357}
.p-selected{background:var(--blue-soft); color:var(--blue)}
.p-yes{background:var(--green-soft); color:var(--green)}
.p-no{background:var(--grey-soft); color:var(--grey)}
.p-emergency{background:#fde4e4; color:var(--red)}
.p-eeg{background:#efe7fb; color:#5a2fb0}
.ok{color:var(--green); font-weight:700} .bad{color:var(--red); font-weight:700}
.empty-row td{color:var(--ink-3); text-align:center; padding:26px}
.store-note{font-size:14px; color:var(--ink-3); margin-top:10px}

/* EEG */
.eeg-grid{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:18px; align-items:start}
.think{display:grid; grid-template-columns:minmax(0,1fr); gap:10px}
.think button{display:flex; align-items:center; gap:14px; min-height:68px; padding:10px 16px; border-radius:var(--r-md); border:2px solid var(--line); background:#fff; text-align:left; font-weight:600; font-size:17px}
.think button:hover{border-color:#7b4fd0}
.think .num{flex:0 0 auto; width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:#efe7fb; color:#5a2fb0; font-family:var(--f-display); font-weight:900; font-size:20px}
.think .lbl{display:block; font-size:13px; color:var(--ink-3); font-weight:600}
.think .ph{display:block; font-family:var(--f-display); font-weight:800; font-size:19px; overflow-wrap:anywhere}
.result{border-radius:var(--r-lg); padding:20px; border:3px solid var(--line); background:#fff; min-height:150px; display:flex; flex-direction:column; justify-content:center; gap:6px}
.result.ok-b{border-color:var(--green); background:#f3fbf5}
.result.bad-b{border-color:var(--red); background:#fff5f5}
.result .big{font-family:var(--f-display); font-weight:900; font-size:26px; line-height:1.2}
.result .phr{font-size:20px; font-weight:600; overflow-wrap:anywhere}
.result .verdict{font-size:15px; font-weight:700}
.conf-bar{height:12px; border-radius:6px; background:#e6f0f3; overflow:hidden}
.conf-bar i{display:block; height:100%; background:var(--teal); width:0; transition:width .4s}
.eeg-yn{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.eeg-yn button{min-height:76px; border:0; border-radius:var(--r-lg); color:#fff; font-family:var(--f-display); font-weight:900; font-size:21px}
.counters{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.counter{background:#fff; border-radius:var(--r-md); padding:14px; border:1px solid var(--line); text-align:center}
.counter b{display:block; font-family:var(--f-display); font-weight:900; font-size:34px; color:var(--ink); font-variant-numeric:tabular-nums}
.counter span{font-size:14px; color:var(--ink-3); font-weight:600}
.diagram{overflow-x:auto}
.flow{display:flex; align-items:stretch; gap:0; min-width:720px; padding:6px 0}
.flow .node{flex:1 1 0; background:#fff; border:2px solid var(--line); border-radius:var(--r-md); padding:14px 10px; text-align:center; font-weight:700; font-family:var(--f-display); font-size:17px; display:flex; flex-direction:column; align-items:center; gap:8px}
.flow .node svg{width:40px; height:40px}
.flow .node.hl{border-color:var(--teal); background:var(--teal-soft)}
.flow .arr{flex:0 0 36px; display:grid; place-items:center; color:var(--teal)}
.flow .arr svg{width:28px; height:28px}
.wave{width:100%; height:70px; display:block}

/* Assistant */
.chat{display:flex; flex-direction:column; gap:12px; min-height:340px; max-height:56vh; overflow-y:auto; padding:6px 2px}
.msg{max-width:min(78%,620px); padding:14px 18px; border-radius:20px; font-size:18px; white-space:pre-wrap; overflow-wrap:anywhere}
.msg.u{align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:6px}
.msg.a{align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:6px}
.msg.a.thinking{color:var(--ink-3); font-style:italic}
.composer{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; margin-top:14px}
.quick{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.quick button{min-height:46px; padding:0 14px; border-radius:14px; border:2px solid var(--line); background:#fff; font-size:15px; font-weight:600; color:var(--ink-2); text-align:left}

/* Profile / survey */
.form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.form-grid .full{grid-column:1/-1}
.hint{font-size:14px; color:var(--ink-3); margin-top:6px}
.saved-msg{font-weight:700; color:var(--green)}
.sus{display:flex; flex-direction:column; gap:12px}
.sus-item{background:#fff; border:1px solid var(--line); border-radius:var(--r-md); padding:16px}
.sus-item p{margin:0 0 12px; font-weight:600; font-size:18px}
.sus-item p b{color:var(--teal); font-family:var(--f-display); margin-right:6px}
.scale{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px}
.scale button{min-height:56px; border-radius:14px; border:2px solid var(--line); background:#fff; font-family:var(--f-display); font-weight:900; font-size:22px; color:var(--ink-2)}
.scale button[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:#fff}
.scale-ends{display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--ink-3); margin-top:6px}
.score{font-family:var(--f-display); font-weight:900; font-size:22px; color:var(--teal)}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--emerg-h) + 24px + env(safe-area-inset-bottom,0px)); z-index:50; background:var(--ink); color:#fff; padding:12px 20px; border-radius:14px; font-weight:600; box-shadow:var(--shadow); max-width:calc(100% - 32px)}

/* Emergency alarm overlay + caregiver toggle */
.alert-ov{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:20px; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px)); background:rgba(150,20,20,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)}
.alert-ov.active{animation:alarmbg 1s steps(2) infinite}
@keyframes alarmbg{50%{background:rgba(207,52,52,.82)}}
.alert-ov.done{background:rgba(16,40,58,.45); animation:none}
.alert-box{width:min(620px,100%); background:#fff; border-radius:var(--r-xl); padding:28px; text-align:center; box-shadow:0 30px 70px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:12px}
.alert-kicker{font-family:var(--f-display); font-weight:900; font-size:22px; letter-spacing:.12em; color:var(--red)}
.alert-ov.done .alert-kicker{color:var(--green)}
.alert-text{font-family:var(--f-display); font-weight:900; font-size:clamp(30px,6vw,46px); line-height:1.15; color:var(--ink); overflow-wrap:break-word}
.alert-meta{color:var(--ink-3); font-size:16px}
.alert-actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:6px}
.alert-actions button{min-height:72px; padding:0 30px; border:0; border-radius:999px; font-family:var(--f-display); font-weight:900; font-size:24px; color:#fff}
.alert-actions .ack{background:var(--green)} .alert-actions .cancel{background:var(--grey)} .alert-actions .ok{background:var(--teal)}
.cg-toggle{display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:0 16px; border-radius:999px; border:2px solid var(--line); background:#fff; font-weight:800; font-family:var(--f-display); font-size:16px; color:var(--ink-2)}
.cg-toggle svg{width:20px; height:20px}
.cg-toggle[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:#fff}
.top-right{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end}
.pm-auto-info{margin:10px 0 0; font-size:15px; color:var(--ink-2)}
.toggle.small{min-height:52px; font-size:17px}

/* Eye tracking: dwell selection */
.gaze-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; margin-top:14px; padding-top:14px; border-top:1px solid var(--glass-edge)}
.gazing{outline:6px solid var(--focus); outline-offset:3px}
.gazing::after{content:""; position:absolute; left:10px; right:10px; bottom:6px; height:8px; border-radius:4px; pointer-events:none;
  background:linear-gradient(90deg, var(--focus) calc(var(--gp,0) * 100%), rgba(242,183,5,.18) 0)}
.em, #cYes, #cNo{position:relative}
.gaze-dot{position:fixed; left:0; top:0; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; border:3px solid var(--focus); background:rgba(242,183,5,.18); pointer-events:none; z-index:70; transform:translate(-100px,-100px)}
.gaze-on, .gaze-on *{cursor:none}
.gaze-stats{display:flex; gap:16px; flex-wrap:wrap; font-size:15px; color:var(--ink-2); margin-top:10px}
.gaze-stats b{font-family:var(--f-display); font-weight:900; font-variant-numeric:tabular-nums}

/* Webcam eye tracking */
.cam-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px}
.cam-row .btn{min-height:54px; font-size:18px}
#camStatus .file-msg{margin-top:10px}

/* Neuro-Relay P300 — нейросеть и обработка ЭЭГ в браузере.
 *
 * Точный перенос Python-конвейера (data.py + MLP из scikit-learn) на JavaScript:
 *   полосовой фильтр (как scipy.signal.sosfiltfilt) -> эпохи 0–800 мс -> 160 признаков ->

 *

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){} if(typeof renderVoiceSelect==="function") renderVoiceSelect()}
try{loadVoices(); speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
// Browsers don't report a voice's sex, so we recognise common voice names; otherwise we shift the pitch.
const FEMALE_RX=/female|woman|zira|samantha|victoria|karen|moira|tessa|susan|hazel|jenny|aria|libby|sonia|natasha|serena|allison|ava|milena|irina|alena|alyona|svetlana|ekaterina|dariya|daria|katya|anna|polina|aigul|madina|saltanat|google русский|google us english/i;
const MALE_RX=/\bmale\b|\bman\b|david|mark|\balex\b|daniel|fred|george|ryan|guy|thomas|aaron|arthur|pavel|dmitr|yuri|maxim|nikolai|nicolai|aidar|daulet|google uk english male/i;
function voiceSex(v){ const n=v.name||""; if(FEMALE_RX.test(n)) return "female"; if(MALE_RX.test(n)) return "male"; return "" }
function langVoices(){
  // Kyrgyz and Kazakh are close relatives: without a native voice use the other one, then Russian.
  const by=l=>voices.filter(x=>x.lang&&(x.lang===TTS_LANG[l]||x.lang.slice(0,2).toLowerCase()===l));
  const chain={kk:["kk","ky","ru"], ky:["ky","kk","ru"]}[S.lang]||[S.lang];
  for(const l of chain){ const v=by(l); if(v.length){ S.voiceLang=l; return v } }
  S.voiceLang=null; return [];
}
function pickVoice(){
  const list=langVoices(), g=S.profile.gender||"";
  if(S.profile.voiceURI){ const chosen=voices.find(x=>x.voiceURI===S.profile.voiceURI); if(chosen) return {v:chosen, pitch:1, matched:true} }
  if(!list.length) return {v:null, pitch:g==="male"?.75:g==="female"?1.15:1, matched:false};
  if(!g) return {v:list[0], pitch:1, matched:true};
  const m=list.find(x=>voiceSex(x)===g);
  if(m) return {v:m, pitch:1, matched:true};
  // No voice of the wanted sex for this language: lower or raise the pitch of the available one.
  const opp=voiceSex(list[0]);
  const pitch = g==="male" ? (opp==="female"?.6:.8) : (opp==="male"?1.4:1.2);
  return {v:list[0], pitch, matched:false};
}
function speak(text, urgent){
  try{
    const u=new SpeechSynthesisUtterance(text);
    const {v,pitch}=pickVoice();
    if(v){u.voice=v; u.lang=v.lang} else u.lang=TTS_LANG[S.lang];
    u.pitch=pitch;
    const rate=+S.profile.rate||.95;
    u.rate=urgent?Math.max(rate,1.05):rate; u.volume=1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- Talk page ---------------- */
function favList(){ return (S.profile.freq||"").split("\n").map(s=>s.trim()).filter(Boolean) }
function customTopicList(){ return (S.profile.customTopics||"").split(/[,;\n]/).map(s=>s.trim()).filter(Boolean).slice(0,8) }
function topicLabel(t){ return t.startsWith("c:")?t.slice(2):T("t_"+t) }
/* Phrases this person actually chose (Session Log): recent ones count more, so do ones chosen
   at about this time of day and, when given, under the same topic. */
function historyPhrases(topic){
  const now=Date.now(), hr=new Date().getHours(), score=new Map();
  for(const r of S.log){
    if((r.action!=="yes"&&r.action!=="eeg_yes")||r.lang!==S.lang||!r.detail) continue;
    const p=String(r.detail).trim(); if(!p) continue;
    let w=Math.exp(-(now-r.ts)/86400000/14);
    const h=new Date(r.ts).getHours(), dh=Math.min(Math.abs(h-hr),24-Math.abs(h-hr));
    if(dh<=2) w*=1.6;
    if(topic&&r.topic===topic) w*=1.5;
    score.set(p,(score.get(p)||0)+w);
  }
  return [...score.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}
function topicIds(){
  const fav=S.profile.favTopics||[];
  const base=[...TOPICS.filter(t=>fav.includes(t)), ...TOPICS.filter(t=>!fav.includes(t))];
  return [...(favList().length?["fav"]:[]), ...(historyPhrases().length>=3?["hist"]:[]), ...base, ...customTopicList().map(c=>"c:"+c)];
}
function renderTopics(){

  $$("#topics .chip").forEach(b=>b.onclick=()=>{ S.topic=ids[+b.dataset.k]; renderTopics(); if(S.topic==="fav"||S.topic==="hist") fetchPhrases(false,"touch") });
}
function renderTiles(){

  html+=`<button class="tile more${S.focus===5?" focused":""}" data-idx="5"><span class="num"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="txt">${esc(S.loading?T("loading"):T("more"))}</span></button>`;
  tiles.innerHTML=html;

function bankPhrases(more){
  const b=BANK[S.lang]; const tp=b[S.topic]||b.general;
  let pool=more?[...tp,...b.extra,...b.general]:tp.slice();
  if(more){ pool=pool.filter(p=>!S.phrases.includes(p)); pool.sort(()=>Math.random()-.5) }
  // include favourite phrases from profile when available
  const freq=favList();
  if(freq.length && !more){ pool=[...freq.slice(0,2),...pool] }
  // one phrase this person often chose under this topic
  if(!more){ const h=historyPhrases(topicLabel(S.topic)).find(x=>!pool.slice(0,4).includes(x)); if(h) pool=[...pool.slice(0,freq.length?2:0), h, ...pool.slice(freq.length?2:0)] }
  return [...new Set(pool)].slice(0,5);
}
let phraseCtl=null;
async function fetchPhrases(more, method){
  if(S.loading) return;
  const other=$("#otherSaid").value.trim();
  S.loading=true; S.focus=-1; renderTiles();
  let list=null, source="bank";
  if(S.topic==="fav"){
    // Favourite phrases are shown directly, five at a time; "More" pages through them.
    const fav=favList();
    S.favOffset = more ? (S.favOffset||0)+5 : 0;
    if(S.favOffset>=fav.length) S.favOffset=0;
    list=fav.slice(S.favOffset, S.favOffset+5);
    if(list.length<5) list=[...list, ...fav.slice(0, 5-list.length).filter(x=>!list.includes(x))];
    source="fav";
  }
  else if(S.topic==="hist"){
    const hist=historyPhrases();
    S.histOffset = more ? (S.histOffset||0)+5 : 0;
    if(S.histOffset>=hist.length) S.histOffset=0;
    list=hist.slice(S.histOffset, S.histOffset+5);
    if(list.length<5) list=[...list, ...hist.filter(x=>!list.includes(x))].slice(0,5);
    source="hist";
  }
  else if(await ensureSample()){
    phraseCtl=new AbortController();
    const p=S.profile;
    // Only non-private profile fields are sent to the AI. Documents, phones and addresses never are.
    const fullName=[p.firstName,p.middleName].filter(Boolean).join(" ");
    const age=ageFrom(p.birthDate);
    const rels=(p.relatives||[]).filter(r=>r.name).map(r=>r.rel?`${r.name} (${r.rel})`:r.name).join(", ");
    const favT=[...(p.favTopics||[]).map(t=>T("t_"+t)), ...customTopicList()].join(", ");
    const prof=[fullName&&`Name: ${fullName}`, p.gender&&`Sex: ${p.gender} — use ${p.gender==="female"?"feminine":"masculine"} grammatical forms for the person (e.g. Russian "${p.gender==="female"?"устала":"устал"}")`, age&&`Age: ${age}`, p.cond&&`Condition: ${p.cond}`, rels&&`Relatives: ${rels}`, favT&&`Favourite topics: ${favT}`, p.fav&&`Favourite things: ${p.fav}`, p.freq&&`Favourite phrases: ${p.freq.replace(/\n/g," | ")}`].filter(Boolean).join("\n") || "No profile yet.";
    const prompt=`You are the phrase engine of Neuro-Relay, an AAC (augmentative communication) app for a person who cannot speak (e.g. ALS, stroke, locked-in) and answers by choosing tiles.
Suggest exactly 5 short phrases the PERSON could say next, in first person, in ${LANG_FULL[S.lang]} (natural, everyday ${LANG_FULL[S.lang]}${S.lang==="kk"||S.lang==="ky"?" in Cyrillic script":""}).
Rules: each phrase at most 8 words; varied meanings (include at least one clear yes-type and one no-type answer when the other person asked a question); warm, respectful, practical; no emojis; no numbering.
Topic: ${topicLabel(S.topic)}.
What the other person just said: ${other?`"${other}"`:"(nothing typed)"}.
Recently spoken by the person: ${S.history.slice(-4).join(" | ")||"(none)"}.
${more?`Do NOT repeat these phrases already shown: ${S.phrases.join(" | ")}.`:""}
${(()=>{ const h=historyPhrases(topicLabel(S.topic)).slice(0,8); return h.length?`Phrases this person has chosen most often recently, especially at this time of day (reuse or adapt them when they fit): ${h.join(" | ")}.\n`:"" })()}User profile (use names and preferences when relevant):
${prof}
Reply with only a JSON array of 5 strings, e.g. ["…","…","…","…","…"].`;
    try{
      const res=await aiJson(prompt, phraseCtl.signal);
      if(Array.isArray(res)){ list=res.map(x=>String(x).trim()).filter(Boolean).map(x=>x.split(/\s+/).slice(0,8).join(" ")).slice(0,5); if(list.length>=3) source="ai"; else list=null }
      if(S.ai!=="ready"){ S.ai="ready"; renderAiBanners() }
    }catch(e){ aiFail(e) }
  }
  if(!list){ list=bankPhrases(more) }
  while(list.length<5) list.push(BANK[S.lang].extra[list.length]);
  S.phrases=list; S.source=source; S.loading=false; S.focus=-1;
  S.pm.pos=-1; S.pm.shownAt=Date.now(); if(S.pm.on) pmRestart();
  renderTiles(); applyScanHl();
  logAction("shown", list.map((p,i)=>`${i+1}. ${p}`).join("  "), source==="ai"?"ai":source==="fav"?"fav":source==="hist"?"hist":"bank", {trigger:method||"touch", topic:topicLabel(S.topic), otherSaid:other});
}

function openConfirm(idx, method){

  else setTimeout(()=>$("#cYes").focus(),30);
}
function confirmYes(method){
  if(!S.pending) return;
  const {phrase}=S.pending;
  logAction("yes", phrase, method||S.pending.method, {topic:topicLabel(S.topic)});
  if((method||S.pending.method)==="switch") pmOutcome("ok");
  if(S.pm.on){ S.pm.msgs++; if(S.pm.shownAt) S.pm.times.push((Date.now()-S.pm.shownAt)/1000); renderPmStats() }
  closeConfirm();
  say(phrase);
  fetchPhrases(false, method);
}
function confirmNo(method, detail){
  if(!S.pending) return;
  logAction("no", S.pending.phrase+(detail?` (${detail})`:""), method||S.pending.method);
  if(S.pm.on){ S.pm.cancels++; renderPmStats() }
  if((method||S.pending.method)==="switch") pmOutcome(detail==="timeout"?"timeout":"no");
  closeConfirm();
}
function closeConfirm(){ S.pending=null; $("#confirm").hidden=true; applyScanHl() }

/* ---------------- Patient mode: automatic scanning, one switch ---------------- */
// Scan order: tiles 1–5, "More phrases", then the three emergency buttons.
const SCAN_LEN=9;
function pmRestart(){ clearInterval(S.pm.timer); if(S.pm.on) S.pm.timer=setInterval(pmStep, S.pm.speed) }
function pmStep(){
  if(!S.pm.on || S.loading || $("#page-talk").hidden || !$("#alertOv").hidden) return;
  if(!$("#confirm").hidden){
    S.pm.cIdx^=1; S.pm.cSteps++;
    if(S.pm.cSteps>=6){ confirmNo("switch","timeout"); return }   // 3 full YES/NO cycles without a signal = NO
    applyScanHl(); return;
  }
  S.pm.pos=(S.pm.pos+1)%SCAN_LEN; S.pm.selSteps=(S.pm.selSteps||0)+1;
  S.focus=S.pm.pos<6?S.pm.pos:-1;
  applyScanHl();
}
function applyScanHl(){
  $$("#tiles .tile").forEach(t=>t.classList.toggle("focused", +t.dataset.idx===S.focus));
  $$(".em").forEach((b,i)=>b.classList.toggle("focused", S.pm.on && $("#confirm").hidden && S.pm.pos===6+i));
  const open=S.pm.on && !$("#confirm").hidden;
  $("#cYes").classList.toggle("scan-hl", open && S.pm.cIdx===0);
  $("#cNo").classList.toggle("scan-hl", open && S.pm.cIdx===1);
}
function switchPress(){
  if(!S.pm.on || !$("#alertOv").hidden) return;
  S.pm.presses++; renderPmStats();
  const z=$("#switchZone"); z.classList.remove("pulse"); void z.offsetWidth; z.classList.add("pulse");
  if(!$("#confirm").hidden){ if(S.pm.cIdx===0) confirmYes("switch"); else confirmNo("switch"); return }
  const p=S.pm.pos;
  if(p<0) return;
  if(p<5){ S.pm.lastCycles=(S.pm.selSteps||0)/SCAN_LEN; S.pm.selSteps=0; openConfirm(p,"switch") }
  else if(p===5){ S.pm.selSteps=0; fetchPhrases(true,"switch") }
  else triggerEmergency($$(".em")[p-6], "switch");
  S.pm.pos=-1; S.focus=-1; applyScanHl(); pmRestart();
}
function setPatientMode(on){
  if(on&&S.gaze&&S.gaze.on) setGaze(false);

/* Eye features from the 478 face points: where each iris sits inside its eye, plus head position */
function camFeatures(L){
  const mid=(a,b)=>({x:(L[a].x+L[b].x)/2, y:(L[a].y+L[b].y)/2});
  const ma=mid(EYE_A[0],EYE_A[1]), mb=mid(EYE_B[0],EYE_B[1]);

  const eye=(E,c)=>{ const o=L[E[0]], i=L[E[1]], w=d(o,i)||1e-6, ux=(i.x-o.x)/w, uy=(i.y-o.y)/w, dx=c.x-o.x, dy=c.y-o.y;
    return {along:(dx*ux+dy*uy)/w, perp:(-dx*uy+dy*ux)/w, open:d(L[E[2]],L[E[3]])/w} };

  return {v:[A.along, A.perp, B.along, B.perp, (L[1].x-cx)/iod, (L[1].y-cy)/iod, cx, cy, iod], open:[A.open,B.open], ia, ib};

function camLoop(){
  if(!CAM.on) return;

    let ts=performance.now(); if(ts<=CAM.lastTs) ts=CAM.lastTs+1; CAM.lastTs=ts;
    let r=null; try{ r=CAM.lm.detectForVideo(v, ts) }catch(e){}
    const L=r&&r.faceLandmarks&&r.faceLandmarks[0];
    CAM.face=!!(L&&L.length>=478);
    if(CAM.face){
      CAM.feat=camFeatures(L);
      const bs={}; ((r.faceBlendshapes&&r.faceBlendshapes[0]&&r.faceBlendshapes[0].categories)||[]).forEach(c=>bs[c.categoryName]=c.score);
      CAM.open=[1-(bs.eyeBlinkRight??0), 1-(bs.eyeBlinkLeft??0)];
      camBlink(CAM.open[0]<0.45 && CAM.open[1]<0.45);
      if(CAM.model && CAM.tracking && !(CAM.open[0]<0.45&&CAM.open[1]<0.45)) camTrack();
    }

  }

/* Long blink (eyes closed 0.5–3 s) = one signal: in patient mode it is the switch; with gaze it selects at once */
function camBlink(closed){
  const now=performance.now();
  if(closed){ if(!CAM.closedSince) CAM.closedSince=now; return }
  if(!CAM.closedSince) return;
  const dur=now-CAM.closedSince; CAM.closedSince=0;
  if(!CAM.blinkOn||dur<500||dur>3000) return;
  if(S.pm.on){ switchPress(); return }
  if(S.gaze.on&&S.gaze.el){ const el=S.gaze.el; gazeClear(); S.gaze.done=el; gazeActivate(el); return }
  if(!$("#confirm").hidden) confirmYes("gaze");
}
function camDraw(L){

  if(c.width!==Math.round(W*dpr)){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr) }
  const g=c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const st=$("#camState"), dot=$("#camDot");
  const closed=CAM.face&&CAM.open[0]<0.45&&CAM.open[1]<0.45;
  dot.className="cam-dot"+(CAM.face?(closed?" warn":" ok"):"");
  st.textContent=!CAM.face?T("camNoFace"):closed?T("camClosed"):CAM.tracking?T("camTracking"):T("camFace");
  $("#camEyeL").style.width=Math.round(100*Math.max(0,Math.min(1,CAM.open[0])))+"%";
  $("#camEyeR").style.width=Math.round(100*Math.max(0,Math.min(1,CAM.open[1])))+"%";
  if(!L) return;
  // map normalized video coords to the canvas (object-fit: cover)
  const vw=v.videoWidth||640, vh=v.videoHeight||480, sc=Math.max(W/vw,H/vh), ox=(W-vw*sc)/2, oy=(H-vh*sc)/2;

/* Calibration: the person looks at 9 dots; we fit a small regression from eye features to screen points */
function camPoly(f){ const [aA,pA,aB,pB,hx,hy,cx,cy]=f; const a=(aA+aB)/2, q=(pA+pB)/2; return [1,aA,pA,aB,pB,hx,hy,cx,cy,a*a,q*q,a*q] }
function solveRidge(X, y, lam){
  const n=X[0].length, A=Array.from({length:n},()=>new Array(n).fill(0)), b=new Array(n).fill(0);
  X.forEach((r,k)=>{ for(let i=0;i<n;i++){ b[i]+=r[i]*y[k]; for(let j=0;j<n;j++) A[i][j]+=r[i]*r[j] } });
  for(let i=1;i<n;i++) A[i][i]+=lam;
  for(let i=0;i<n;i++){                                  // Gaussian elimination with partial pivoting
    let m=i; for(let k=i+1;k<n;k++) if(Math.abs(A[k][i])>Math.abs(A[m][i])) m=k;
    [A[i],A[m]]=[A[m],A[i]]; [b[i],b[m]]=[b[m],b[i]];
    const piv=A[i][i]||1e-12;
    for(let k=i+1;k<n;k++){ const f=A[k][i]/piv; for(let j=i;j<n;j++) A[k][j]-=f*A[i][j]; b[k]-=f*b[i] }
  }
  const w=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){ let t=b[i]; for(let j=i+1;j<n;j++) t-=A[i][j]*w[j]; w[i]=t/(A[i][i]||1e-12) }

}
function camFit(samples){
  const raw=samples.map(s=>camPoly(s.f));

  for(let j=1;j<n;j++){ mu[j]=raw.reduce((a,r)=>a+r[j],0)/raw.length; sd[j]=Math.sqrt(raw.reduce((a,r)=>a+(r[j]-mu[j])**2,0)/raw.length)||1 }
  const X=raw.map(r=>r.map((v,j)=>j?(v-mu[j])/sd[j]:1));
  const wx=solveRidge(X, samples.map(s=>s.x), 0.5), wy=solveRidge(X, samples.map(s=>s.y), 0.5);
  const model={mu, sd, wx, wy, W:innerWidth, H:innerHeight};
  const err=samples.map(s=>{ const [px,py]=camPredict(model,s.f); return Math.hypot(px-s.x,py-s.y) });
  model.err=err.reduce((a,b)=>a+b,0)/err.length;

function camPredict(m, f){
  const r=camPoly(f).map((v,j)=>j?(v-m.mu[j])/m.sd[j]:1);
  let x=0,y=0; for(let j=0;j<r.length;j++){ x+=r[j]*m.wx[j]; y+=r[j]*m.wy[j] }
  return [x*innerWidth/m.W, y*innerHeight/m.H];

let calibToken=0;
async function camCalibrate(){
  if(!CAM.on||!CAM.lm) return;
  const tok=++calibToken, ov=$("#calibOv"), dot=$("#calibDot"), txt=$("#calibText");
  CAM.tracking=false; ov.hidden=false;
  txt.textContent=T("calibIntro"); dot.hidden=true;
  await wait(2500); if(tok!==calibToken) return;
  const pts=[[.1,.12],[.5,.12],[.9,.12],[.1,.5],[.5,.5],[.9,.5],[.1,.86],[.5,.86],[.9,.86]];
  const samples=[];
  for(let k=0;k<pts.length;k++){
    const x=pts[k][0]*innerWidth, y=pts[k][1]*innerHeight;
    txt.textContent=T("calibPoint",{n:k+1,t:pts.length}); txt.style.top=(pts[k][1]<.4?72:28)+"%";
    dot.hidden=false; dot.style.left=x+"px"; dot.style.top=y+"px"; dot.classList.remove("go"); void dot.offsetWidth; dot.classList.add("go");
    await wait(550); if(tok!==calibToken) return;

function camTrack(){
  const [px,py]=camPredict(CAM.model, CAM.feat.v);

/* ---------------- Emergency ---------------- */
function renderEmergency(){ $$(".em").forEach(b=>b.textContent=T("em_"+b.dataset.em)) }
/* Siren (Web Audio): sound may start only after the viewer has touched the page once */
let audioCtx=null;

function siren(seconds){

    const t0=ctx.currentTime+0.02, o=ctx.createOscillator(), g=ctx.createGain(), comp=ctx.createDynamicsCompressor();
    o.type="square";
    for(let t=0;t<seconds;t+=0.8){ o.frequency.setValueAtTime(960,t0+t); o.frequency.setValueAtTime(650,t0+t+0.4) }
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.55,t0+0.05);
    g.gain.setValueAtTime(0.55,t0+seconds-0.1); g.gain.exponentialRampToValueAtTime(0.0001,t0+seconds);
    o.connect(g); g.connect(comp); comp.connect(ctx.destination); o.start(t0); o.stop(t0+seconds+0.05);
  }catch(e){}

function chime(){
  const ctx=ensureAudio(); if(!ctx) return;
  try{ [660,880].forEach((f,k)=>{ const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime+k*0.22;
    o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);

}

// Wolpaw information transfer rate: bits per selection × selections per minute (N = 5 phrases)
function itr(P, sels, seconds){
  const N=5; P=Math.min(.9999,P); if(P<=1/N) return 0;
  const B=Math.log2(N)+P*Math.log2(P)+(1-P)*Math.log2((1-P)/(N-1));
  return B*sels/(seconds/60);
}

/* One EEG attempt on any 5 tiles: the virtual user's EEG is generated, played live on the monitor in sync with the
   flashes, and the neural network (plus the personal layer, if on) scores every flash. Returns null if stopped. */
async function flashAttempt(tiles, target, rounds, tok, onRound){
  const {sim, r}=runTrial(target, rounds);
  const final=NET.selectTile(r.scores, r.events, rounds);
  trackAdapt(r, rounds, target, final.tile);
  tiles.forEach(t=>{ t.classList.remove("win","wrong"); t.querySelector(".bar i").style.width="0"; t.querySelector(".pct").textContent="" });
  const start=playTrial(sim, r);
  const until=sec=>wait(Math.max(0, start+sec*1000-performance.now()));
  const evs=sim.events;
  for(let i=0;i<evs.length;i++){
    const ev=evs[i];
    if(i===0||evs[i-1].round!==ev.round) onRound(ev.round);
    await until(ev.time_s); if(tok!==p3Token) return null;
    tiles[ev.tile-1].classList.add("flash");
    await until(ev.time_s+0.15); tiles[ev.tile-1].classList.remove("flash");
    if(i===evs.length-1||evs[i+1].round!==ev.round){
      const est=NET.selectTile(r.scores, r.events, ev.round);
      tiles.forEach((t,j)=>{ const pc=Math.round(100*est.probs[j]); t.querySelector(".bar i").style.width=pc+"%"; t.querySelector(".pct").textContent=pc+"%" });
    }
  }
  await until(evs[evs.length-1].time_s+0.8);   // the last flash needs 0.8 s of EEG after it
  if(tok!==p3Token) return null;
  return {winner:final.tile, ok:final.tile===target, conf:Math.round(final.confidence*100), r, sim};
}
// The YES/NO confirmation is a simpler two-choice signal, so it is more reliable (95%).
function simConfirm(ok){ const reliable=Math.random()<.95; return ok?reliable:!reliable }

async function p3Message(){
  const tok=p3Token; S.p3.running=true; p3Buttons();
  const target=S.p3.target||1+Math.floor(Math.random()*5);
  const t0=performance.now();
  renderP3Grid();
  const tiles=$$("#p3Grid .ptile");
  tiles[target-1].classList.add("want"); tiles[target-1].dataset.want=T("wantLbl");
  for(let attempt=1; attempt<=3; attempt++){
    if(!NET) break;
    const rounds=+$("#p3Rounds").value;
    const res=await flashAttempt(tiles, target, rounds, tok, rd=>p3Status(`${esc(T("p3Flash",{r:rd,n:rounds}))}<small>${esc(T("attempt",{a:attempt}))}</small>`));
    if(!res) return;
    const {winner, ok, conf}=res;
    const phrase=S.phrases[winner-1];
    tiles[winner-1].classList.add("win"); if(!ok) tiles[winner-1].classList.add("wrong");
    S.eeg.sel++; S.eeg.n++; S.eeg.p3sel++; if(ok){ S.eeg.ok++; S.eeg.p3ok++ }
    hlFlow(2);
    logAction("eeg_select", phrase, "p300", {intended:target, recognized:winner, confidence:conf, correct:ok, rounds, attempt, quality:S.quality, network:true});
    p3Status(`${esc(T("p3Decide",{n:winner,c:conf}))}<small>“${esc(phrase)}”</small>`, ok?"ok-b":"bad-b");
    renderCounters();
    await wait(900); if(tok!==p3Token) return;
    p3Status(`${esc(T("p3Confirm"))}<small>“${esc(phrase)}”</small>`, "ask");
    await wait(1200); if(tok!==p3Token) return;
    // The YES/NO confirmation is a simpler two-choice signal, so it is more reliable (95%).
    const userYes=simConfirm(ok);
    if(userYes){
      learnFrom(res.r, winner);
      const secs=(performance.now()-t0)/1000;
      S.eeg.msg++; S.eeg.times.push(secs); S.eeg.p3time+=secs; if(!ok) S.eeg.wrong++;
      logAction("eeg_yes", phrase, "p300", {intended:target, recognized:winner, confidence:conf, correct:ok, attempt, seconds:+secs.toFixed(1)});
      say(phrase); hlFlow(4);
      p3Status(`${esc(ok?T("p3Yes"):T("p3Wrong"))}<small>“${esc(phrase)}” · ${secs.toFixed(1)} s</small>`, ok?"ok-b":"bad-b");
      renderCounters(); S.p3.running=false; p3Buttons(); return;
    }
    if(!ok) S.eeg.caught++;
    logAction("eeg_no", phrase, "p300", {intended:target, recognized:winner, confidence:conf, correct:ok, attempt});
    p3Status(`${esc(T("p3No"))}<small>“${esc(phrase)}”</small>`, "bad-b");
    renderCounters();
    await wait(900); if(tok!==p3Token) return;
  }
  S.eeg.p3time+=(performance.now()-t0)/1000;
  p3Status(esc(T("p3GiveUp")), "bad-b"); renderCounters();
  S.p3.running=false; p3Buttons();
}

async function sentCandidates(k, plan){

  const hit=pool.some(w=>normW(w)===normW(target));
  const others=S.sent.words.filter((w,i)=>i!==k).sort(()=>simRng.u()-.5).slice(0,1);
  const vocab=[...(SENT_VOCAB[S.lang]||SENT_VOCAB.en)].sort(()=>simRng.u()-.5);
  const out=[], seen=new Set([normW(target)]);
  for(const w of [...pool, ...others, ...vocab]){ if(out.length>=4) break; const n=normW(w); if(!n||seen.has(n)) continue; seen.add(n); out.push(w) }
  const pos=simRng.int(1,5); out.splice(pos-1,0,target);
  return {words:out, pos, src, hit};
}
async function sentRun(plan){
  if(!NET||S.sent.running) return false;
  const text=$("#sentText").value.trim();
  if(!text){ toast(T("sentEmpty")); return false }
  const keep={auto:S.brain.auto, plan:S.brain.plan}; p3Stop(); S.brain.auto=keep.auto; S.brain.plan=keep.plan; aiPatientButtons();
  const tok=p3Token; S.sent.running=true; S.sent.words=text.split(/\s+/).slice(0,12); S.sent.built=[]; sentButtons();
  $("#sentStats").textContent="";
  const t0=performance.now(); let okWords=0, sels=0;
  logAction("eeg_sentence_start", S.sent.words.join(" "), "p300", {words:S.sent.words.length, quality:S.quality});
  for(let k=0;k<S.sent.words.length;k++){
    const want=S.sent.words[k];
    renderBuilt(k);
    sentStatus(`${esc(T("sentPicking"))}<small>${esc(T("sentWordOf",{k:k+1,n:S.sent.words.length}))}</small>`);
    const c=await sentCandidates(k, plan); if(tok!==p3Token) return false;
    sentWordGrid(c.words);
    const tiles=$$("#sentGrid .ptile");
    tiles[c.pos-1].classList.add("want"); tiles[c.pos-1].dataset.want=T("wantLbl");
    $("#sentSource").textContent=c.src==="patient"?T("sentPatient",{p:aiProviderName()}):c.src==="ai"?(c.hit?T("sentAiHit",{w:want}):T("sentAiMiss",{w:want, p:c.pos})):T("sentVocab");
    let done=null;
    for(let attempt=1; attempt<=3&&!done; attempt++){
      const rounds=+$("#p3Rounds").value;
      const res=await flashAttempt(tiles, c.pos, rounds, tok, rd=>sentStatus(`${esc(T("sentThink",{w:want}))}<small>${esc(T("p3Flash",{r:rd,n:rounds}))} · ${esc(T("attempt",{a:attempt}))}</small>`));
      if(!res) return false;
      const word=c.words[res.winner-1];
      tiles[res.winner-1].classList.add("win"); if(!res.ok) tiles[res.winner-1].classList.add("wrong");
      sels++; S.eeg.sel++; S.eeg.n++; S.eeg.p3sel++; if(res.ok){ S.eeg.ok++; S.eeg.p3ok++ }
      logAction("eeg_select", word, "p300", {intended:c.pos, recognized:res.winner, confidence:res.conf, correct:res.ok, rounds, attempt, quality:S.quality, network:true, sentence:true, wanted:want});
      sentStatus(`${esc(T("p3Decide",{n:res.winner,c:res.conf}))}<small>“${esc(word)}”</small>`, res.ok?"ok-b":"bad-b");
      renderCounters();
      await wait(800); if(tok!==p3Token) return false;
      if(simConfirm(res.ok)){
        learnFrom(res.r, res.winner);
        done={w:word, ok:res.ok}; if(res.ok) okWords++; else S.eeg.wrong++;
        logAction("eeg_yes", word, "p300", {intended:c.pos, recognized:res.winner, correct:res.ok, attempt, sentence:true});
      } else {
        if(!res.ok) S.eeg.caught++;
        logAction("eeg_no", word, "p300", {intended:c.pos, recognized:res.winner, correct:res.ok, attempt, sentence:true});
        sentStatus(`${esc(T("p3No"))}<small>“${esc(word)}”</small>`, "bad-b"); renderCounters();
        await wait(700); if(tok!==p3Token) return false;
      }
    }
    S.sent.built.push(done||{w:want, miss:true});
    renderBuilt(k+1);
  }
  const secs=(performance.now()-t0)/1000, sentence=S.sent.built.filter(b=>!b.miss).map(b=>b.w).join(" ");
  S.eeg.msg++; S.eeg.times.push(secs); S.eeg.p3time+=secs;
  const n=S.sent.words.length, wpm=(okWords/(secs/60)).toFixed(1);
  sentStatus(`${esc(T("sentDone"))}<small>“${esc(sentence)}”</small>`, okWords===n?"ok-b":"bad-b");
  $("#sentStats").textContent=T("sentStats",{k:okWords, n, t:secs.toFixed(0), s:sels, wpm:S.lang==="en"?wpm:wpm.replace(".",",")});
  renderCounters();
  if(sentence){ say(sentence); hlFlow(4) }
  logAction("eeg_sentence", sentence, "p300", {wanted:S.sent.words.join(" "), correctWords:okWords, words:n, selections:sels, seconds:+secs.toFixed(1), quality:S.quality, adapt:S.adaptOn});
  S.sent.running=false; sentButtons();
  return true;
}

/* ---------------- AI patient: the virtual person's "mind" runs on the remote AI ----------------
   The same AI as the AI Agent (Claude inside claude.ai; Gemini or Claude with your key in a downloaded copy)
   plays the patient: it decides what they want to say, the wrong word options for the tiles, and how their
   attention and fatigue change every second for the next minute (with reasons). The app turns that into EEG,
   and the neural network decodes it locally in the browser (fast, private, works between AI calls). */
function aiProviderName(){ return STANDALONE?(apiProvider()==="claude"?"Claude":"Gemini"):"Claude" }
function profileForAi(){
  const p=S.profile||{};
  const fullName=[p.firstName,p.middleName].filter(Boolean).join(" "), age=ageFrom(p.birthDate);
  const rels=(p.relatives||[]).filter(r=>r.name).map(r=>r.rel?`${r.name} (${r.rel})`:r.name).join(", ");
  const favT=[...(p.favTopics||[]).map(t=>T("t_"+t)), ...customTopicList()].join(", ");
  // Only non-private fields, as on the Talk page: documents, phones and addresses are never sent.
  return [fullName&&`Name: ${fullName}`, p.gender&&`Sex: ${p.gender} (use ${p.gender==="female"?"feminine":"masculine"} grammatical forms)`, age&&`Age: ${age}`, p.cond&&`Condition: ${p.cond}`, rels&&`Relatives: ${rels}`, favT&&`Favourite topics: ${favT}`, p.fav&&`Favourite things: ${p.fav}`].filter(Boolean).join("\n")||"No profile: invent a plausible adult patient.";
}
const num01=v=>{ const x=+v; return isFinite(x)?Math.min(1,Math.max(0,x)):null };
async function aiPatientPlan(){
  const lang=LANG_FULL[S.lang]+(S.lang==="kk"||S.lang==="ky"?" (Cyrillic)":"");
  const prompt=`You play a VIRTUAL PATIENT in an EEG brain-computer-interface simulator. The patient has ALS, cannot speak or move, and communicates by concentrating on flashing word tiles (P300).
Patient profile:
${profileForAi()}
Already said in this session (do not repeat, change the topic): ${S.brain.history.slice(-6).join(" | ")||"nothing yet"}
1. Decide what the patient wants to say NOW: one short everyday sentence in ${lang}, 3-7 words (a need, a feeling, family, comfort, a question to the caregiver).
2. For each word give 4 OTHER words in ${lang} that could stand at the same position (wrong options for the tiles; different from the word).
3. Simulate the patient's mind for the next 60 seconds, one value per second: "attention" 0-1 (usually 0.6-0.95, drifting; sometimes a sudden drop for a few seconds when distracted by noise, pain, a thought) and "fatigue" 0-1 (starts at ${S.mind.fat.toFixed(2)}, rises slowly while working).
4. Up to 3 short notes in ${lang} (max 6 words) explaining notable attention changes, with the second "t" when they happen.
Return ONLY a JSON array with one object, no other text:
[{"sentence":"...","words":["..."],"distractors":[["w","w","w","w"]],"attention":[60 numbers],"fatigue":[60 numbers],"notes":[{"t":12,"text":"..."}]}]`;
  let arr=await withTimeout(aiJson(prompt, undefined, 2500), 30000);
  const o=Array.isArray(arr)?arr[0]:arr;
  if(!o||typeof o.sentence!=="string"||!o.sentence.trim()) throw {code:"invalid_json"};
  const sentence=o.sentence.trim().replace(/\s+/g," "), words=sentence.split(" ").slice(0,12);
  const dis=words.map((w,i)=>((o.distractors||[])[i]||[]).filter(x=>typeof x==="string"&&x.trim()).map(x=>x.trim().split(/\s+/)[0]).filter(x=>normW(x)!==normW(w)).slice(0,4));
  const att=[], fat=[]; let la=S.mind.att, lf=S.mind.fat;
  for(let i=0;i<60;i++){ const a=num01((o.attention||[])[i]), f=num01((o.fatigue||[])[i]); la=a??la; lf=f??lf; att.push(Math.max(.15,la)); fat.push(lf) }
  const notes={}; (o.notes||[]).slice(0,3).forEach(n=>{ const t=Math.round(+n.t); if(n&&typeof n.text==="string"&&t>=0&&t<60) notes[t]=n.text.slice(0,60) });
  return {sentence:words.join(" "), distractors:dis, attention:att, fatigue:fat, notes, i:0};
}

/* ---------------- Neural network (trained in Python, runs here in the browser) ---------------- */
let NET=null;
try{ NET=NeuroNet.create(JSON.parse(document.getElementById("p300-model").textContent)) }catch(e){ console.error("P300 model failed to load", e) }
const simRng=NeuroNet.makeRng(((Date.now()%1e9)^Math.floor(Math.random()*1e9))>>>0);
S.quality="medium"; S.vuser=NeuroNet.makeUser(S.quality, simRng, {individual:true}); S.netMs=null;
S.sent={running:false, words:[], built:[]};
S.brain={plan:null, auto:false, src:"", history:[], note:"", noteUntil:0};

/* The virtual person's state changes every second: attention drifts (and sometimes drops when distracted),
   fatigue grows while they work and recovers at rest. Low attention = weaker P300 and more missed flashes;
   fatigue also raises the alpha rhythm (drowsiness), which is visible on the monitor. */
S.mind={att:.85, fat:0, q:[]};
function mindStep(m, busy){
  const goal=.88-.4*m.fat;
  let att=m.att+.25*(goal-m.att)+.06*simRng.normal();
  if(simRng.u()<.03) att-=.3;
  att=Math.min(1,Math.max(.15,att));
  const fat=Math.min(1,Math.max(0,m.fat+(busy?.0025:-.004)));
  return {att, fat};
}
function mindNow(m){ return {gain:Math.max(.35,Math.min(1.1,.42+.62*m.att-.2*m.fat)), lapse:.3*(1-m.att), alpha:1+1.3*m.fat} }
// Plan the next seconds ahead so the EEG of an attempt and the meters shown each second follow the same path.
/* When the AI patient is on, its per-second attention/fatigue (from Gemini or Claude) replace the built-in drift. */
function brainNext(m, busy){
  const P=S.brain.plan;
  if(P&&P.i<P.attention.length){ const i=P.i++; return {att:P.attention[i], fat:P.fatigue[i], note:P.notes[i]||null} }
  return mindStep(m, busy);
}
function mindPlan(sec){
  const out=[]; let m={att:S.mind.att, fat:S.mind.fat};
  for(let i=0;i<sec;i++){ m=brainNext(m,true); out.push(m) }
  S.mind.q=out.slice();
  return t=>mindNow(out[Math.min(out.length-1, Math.max(0, Math.floor(t)))]);
}
setInterval(()=>{
  const m=S.mind, nx=m.q.length?m.q.shift():brainNext(m, S.p3.running||S.sent.running);
  m.att=nx.att; m.fat=nx.fat;
  if(nx.note){ S.brain.note=nx.note; S.brain.noteUntil=Date.now()+7000 }
  renderMind();
},1000);
function renderMind(){
  const el=$("#mind"); if(!el||$("#page-eeg").hidden) return;
  const m=S.mind, a=Math.round(100*m.att), f=Math.round(100*m.fat), amp=(S.vuser.p300_amp_uv*mindNow(m).gain).toFixed(1);
  renderBrainSrc();
  el.innerHTML=`<span class="m att">${esc(T("mindAtt"))}<i><b style="width:${a}%"></b></i>${a}%</span><span class="m fat">${esc(T("mindFat"))}<i><b style="width:${f}%"></b></i>${f}%</span><span class="now">${esc(T("mindNow",{a:S.lang==="en"?amp:amp.replace(".",",")}))}</span>`;
}

/* Personal layer: learns this person's own P300 from confirmed choices (see neuro_net.js, adaptAdd). */
S.adaptOn=true; S.ad={hist:[]};
function learnFrom(r, chosen){
  if(!NET||!S.adaptOn||!r||!r.feats) return;
  NET.adaptAdd(r.feats, r.events.map(e=>e.tile===chosen), r.baseScores);
  renderAdapt();
}
function trackAdapt(r, rounds, target, winner){
  if(!NET||!S.adaptOn||!NET.adapt.w) return;
  const base=NET.selectTile(r.baseScores, r.events, rounds).tile;
  S.ad.hist.push({b:base===target, a:winner===target}); if(S.ad.hist.length>20) S.ad.hist.shift();
}
function renderAdapt(){
  const el=$("#adaptInfo"); if(!el||!NET) return;
  $("#adaptOn").checked=S.adaptOn;
  const A=NET.adapt;
  if(!S.adaptOn){ el.textContent=T("adaptOff"); return }
  if(!A.w){ el.textContent=T("adaptWait"); return }
  let t=T("adaptOnInfo",{n:A.selections, w:Math.round(100*A.weight)});
  const H=S.ad.hist;
  if(H.length>=5) t+=" · "+T("adaptCompare",{n:H.length, b:Math.round(100*H.filter(h=>h.b).length/H.length), a:Math.round(100*H.filter(h=>h.a).length/H.length)});
  el.textContent=t;

$("#adaptOn").onchange=e=>{ S.adaptOn=e.target.checked; if(NET) NET.adaptOpts.on=S.adaptOn; renderAdapt() };

function runTrial(target, rounds, opts){
  // live attempts follow the planned per-second state; step-by-step ones use the state right now
  const secs=Math.ceil(1+rounds*5*0.25+1.8)+1;
  const state=opts&&opts.live===false?(st=>()=>st)(mindNow(S.mind)):mindPlan(secs);
  const sim=NeuroNet.simulateTrial({target, rounds, user:S.vuser, rng:simRng, state});
  const t=performance.now(); const r=NET.scoreFlashes(sim.eeg, sim.events); S.netMs=performance.now()-t;
  renderNetFacts();

}
function renderQuality(){

/* Live EEG monitor: Fz, Cz, Pz, Oz after the 0.5–20 Hz filter — exactly what the network sees. */
const wave=$("#wave"), wctx=wave.getContext("2d");
const MON_CH=[[0,"Fz"],[1,"Cz"],[3,"Pz"],[7,"Oz"]];
let MON={filt:null, events:[], t:0, win:4, live:false, start:0, dur:0};
let monRaf=0;
function sizeWave(){ const r=wave.getBoundingClientRect(), d=devicePixelRatio||1; wave.width=Math.max(1,Math.round(r.width*d)); wave.height=Math.max(1,Math.round(r.height*d)); wctx.setTransform(d,0,0,d,0,0) }
function drawMonitor(){
  const d=devicePixelRatio||1, w=wave.width/d, h=wave.height/d;
  wctx.clearRect(0,0,w,h);
  if(!MON.filt) return;
  const left=58, right=8, top=6, bottom=20, pw=w-left-right, lane=(h-top-bottom)/MON_CH.length, uv=lane/2/25;
  const t1=Math.max(MON.t, Math.min(MON.win, MON.dur)), t0=t1-Math.min(MON.win, MON.dur);
  const X=t=>left+(t-t0)/(t1-t0)*pw;
  // flash markers (only flashes that have already happened)
  for(const ev of MON.events){
    if(ev.time_s<t0||ev.time_s>t1||ev.time_s>MON.t) continue;
    const x=X(ev.time_s);
    wctx.fillStyle=ev.is_target?"#d9661c":"#c3d4da";
    wctx.fillRect(x-(ev.is_target?1:0.5), top, ev.is_target?2:1, h-top-bottom);
  }
  const fs=250, i0=Math.max(0,Math.floor(t0*fs)), i1=Math.min(MON.filt[0].length-1, Math.floor(Math.min(t1,MON.t)*fs));
  const step=Math.max(1, Math.floor((i1-i0)/pw/1.5));
  MON_CH.forEach(([c,name],k)=>{
    const y0=top+lane*(k+0.5), isPz=name==="Pz";
    wctx.save(); wctx.beginPath(); wctx.rect(left, top+lane*k, pw, lane); wctx.clip();
    wctx.beginPath(); wctx.lineWidth=isPz?1.8:1.2; wctx.strokeStyle=isPz?"#1f7f8e":"#5b7584";
    for(let i=i0;i<=i1;i+=step){ const x=X(i/fs), y=y0-MON.filt[c][i]*uv; i===i0?wctx.moveTo(x,y):wctx.lineTo(x,y) }
    wctx.stroke(); wctx.restore();
    wctx.fillStyle=isPz?"#1f7f8e":"#3c5668"; wctx.font=`${isPz?800:700} 13px Nunito, system-ui, sans-serif`; wctx.textBaseline="middle";
    wctx.fillText(name, 8, y0-(isPz?7:0));
    if(isPz){ wctx.font="600 11px Noto Sans, system-ui, sans-serif"; wctx.fillText("P300", 8, y0+8) }
  });
  // scale bars: 1 s and 20 µV
  wctx.strokeStyle="#6b8494"; wctx.lineWidth=1.5; wctx.fillStyle="#6b8494"; wctx.font="600 11px Noto Sans, system-ui, sans-serif"; wctx.textBaseline="alphabetic";
  const sx=w-right-pw*(1/(t1-t0))-4, sy=h-6;
  wctx.beginPath(); wctx.moveTo(sx,sy); wctx.lineTo(sx+pw/(t1-t0),sy); wctx.stroke();
  wctx.textAlign="right"; wctx.fillText(T("sec1"), sx-6, sy+1); wctx.textAlign="left";
}
function monitorLoop(){
  if(!MON.live) return;
  MON.t=(performance.now()-MON.start)/1000;
  if(MON.t>=MON.dur){ MON.t=MON.dur; MON.live=false; liveStart(); return }
  if(!$("#page-eeg").hidden) drawMonitor();
  if(MON.live) monRaf=requestAnimationFrame(monitorLoop);
}
// Play an attempt live (P300 mode). Returns the clock start in ms so flashes can sync to it.
function playTrial(sim, r){
  liveStop(); cancelAnimationFrame(monRaf);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  MON={filt:r.filtered, events:sim.events, t:0, win:4, live:!reduce, start:performance.now(), dur:sim.seconds};
  if(reduce){ MON.t=MON.dur; MON.win=MON.dur; drawMonitor() } else monitorLoop();
  return MON.start;
}
// Show a whole attempt at once (step-by-step mode)
let showT=0;
function showTrial(sim, r){
  liveStop(); cancelAnimationFrame(monRaf); MON={filt:r.filtered, events:sim.events, t:sim.seconds, win:sim.seconds, live:false, start:0, dur:sim.seconds}; drawMonitor();
  clearTimeout(showT); showT=setTimeout(()=>{ if(!S.p3.running&&!S.sent.running&&!MON.live) liveStart() }, 8000);   // back to the live stream
}
/* Continuous EEG between attempts: 6-second blocks of the virtual person's brain activity, generated with the
   state of this second, joined with a short cross-fade and scrolled in real time like a connected headset. */
const LIVE={on:false, buf:null, start:0};
function liveBlock(){
  const sim=NeuroNet.simulateTrial({target:0, rounds:0, user:S.vuser, rng:simRng, minSeconds:6, state:()=>mindNow(S.mind)});
  return NET.scoreFlashes(sim.eeg, []).filtered;
}
function liveAppend(){
  const f=liveBlock(), fs=250, X=Math.round(.4*fs);
  if(!LIVE.buf){ LIVE.buf=f.map(c=>Float64Array.from(c)); return }
  LIVE.buf=LIVE.buf.map((old,c)=>{
    const n=f[c].length, L=old.length, out=new Float64Array(L+n-X);
    out.set(old);
    for(let i=0;i<X;i++){ const w=i/X; out[L-X+i]=old[L-X+i]*(1-w)+f[c][i]*w }
    out.set(f[c].subarray(X), L);
    return out;
  });
  const extra=LIVE.buf[0].length-14*fs;           // keep the last 14 s
  if(extra>0){ LIVE.buf=LIVE.buf.map(c=>c.slice(extra)); LIVE.start+=extra/fs*1000 }
}
function liveStart(fresh){
  if(!NET) return;
  if(LIVE.on&&!fresh) return;
  clearTimeout(showT); cancelAnimationFrame(monRaf);
  if(fresh||!LIVE.buf){ LIVE.buf=null; liveAppend(); LIVE.start=performance.now()-4000 }
  else LIVE.start=performance.now()-4000-(LIVE.buf[0].length/250-5.2)*1000;   // continue from the end of the buffer
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  LIVE.on=!reduce;
  if(reduce){ MON={filt:LIVE.buf, events:[], t:4, win:4, live:false, start:0, dur:LIVE.buf[0].length/250}; drawMonitor(); return }
  liveLoop();
}
function liveStop(){ LIVE.on=false; cancelAnimationFrame(monRaf) }
function liveLoop(){
  if(!LIVE.on) return;
  if($("#page-eeg").hidden){ LIVE.on=false; return }
  let t=(performance.now()-LIVE.start)/1000;
  if(t>LIVE.buf[0].length/250-0.9){ liveAppend(); t=(performance.now()-LIVE.start)/1000 }
  MON={filt:LIVE.buf, events:[], t, win:4, live:false, start:0, dur:LIVE.buf[0].length/250};
  drawMonitor();
  monRaf=requestAnimationFrame(liveLoop);
}
function idleSignal(){ liveStart() }

$("#sampleBtn").onclick=async()=>{

/* ---------------- Own Claude API key: lets a downloaded copy of the app use the AI ---------------- */
// Inside claude.ai the app uses Claude through the viewer (window.claude). A copy opened from disk or another
// site has no viewer, so it calls the Claude API directly with the user's own key (stored only in this browser).
const STANDALONE=!(window.claude&&window.claude.use);
const API_MODELS={quick:"claude-haiku-5-5", chat:"claude-sonnet-5-5"};
const GEMINI_BASE="https://generativelanguage.googleapis.com/v1beta";
const GEMINI_MODELS={quick:["gemini-3.5-flash-lite","gemini-3.6-flash","gemini-flash-lite-latest","gemini-2.5-flash-lite"], chat:["gemini-3.6-flash","gemini-flash-latest","gemini-2.5-flash"]};
const geminiOk={};
function apiKey(){ return (lsGet("nr.apiKey")||"").trim() }
function apiProvider(){ return apiKey().startsWith("sk-ant")?"claude":"gemini" }
async function apiMessages(opts){ return apiProvider()==="claude"?claudeMessages(opts):geminiMessages(opts) }
async function geminiMessages({system, messages, quick, maxTokens}){
  const kind=quick?"quick":"chat", list=[...new Set([...(geminiOk[kind]?[geminiOk[kind]]:[]), ...GEMINI_MODELS[kind]])];
  const body={contents:messages.map(m=>({role:m.role==="assistant"?"model":"user", parts:[{text:m.content}]})), generationConfig:{maxOutputTokens:Math.max(maxTokens||0,2048)}};
  if(system) body.systemInstruction={parts:[{text:system}]};
  let last="";
  for(const model of list){
    let r;
    try{ r=await fetch(`${GEMINI_BASE}/models/${model}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":apiKey()},body:JSON.stringify(body)}) }
    catch(e){ throw {code:"api_network", message:String(e&&e.message||e)} }
    let j=null; try{ j=await r.json() }catch(e){}
    const m=(j&&j.error&&j.error.message)||("HTTP "+r.status);
    if(r.status===404){ last=m; continue }
    if(!r.ok){
      if(/location is not supported/i.test(m)) throw {code:"api_region", message:m};
      throw {code: r.status===401||r.status===403||/api key/i.test(m)?"api_key": r.status===429?"rate_limited": r.status>=500?"api_busy":"api_error", message:m};
    }
    geminiOk[kind]=model;
    const c=((j&&j.candidates)||[{}])[0], text=(((c.content||{}).parts)||[]).filter(p=>!p.thought).map(p=>p.text||"").join("");
    if(!text.trim()) throw {code:"api_error", message:"Gemini: "+(c.finishReason||"empty answer")};
    return text;
  }
  throw {code:"api_error", message:"Gemini: no model found ("+last+")"};
}
async function claudeMessages({system, messages, quick, maxTokens}){
  let r;
  try{
    r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":apiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify(Object.assign({model:quick?API_MODELS.quick:API_MODELS.chat, max_tokens:maxTokens||700, messages}, system?{system}:{}))});
  }catch(e){ throw {code:"api_network", message:String(e&&e.message||e)} }
  let j=null; try{ j=await r.json() }catch(e){}
  if(!r.ok){
    const t=j&&j.error&&j.error.type, m=(j&&j.error&&j.error.message)||("HTTP "+r.status);
    throw {code: r.status===401||r.status===403?"api_key": r.status===429||t==="rate_limit_error"?"rate_limited": r.status===529||t==="overloaded_error"?"api_busy":"api_error", message:m};
  }
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}
function mergeTurns(turns){
  const out=[];
  for(const t of turns){ const last=out[out.length-1]; if(last&&last.role===t.role) last.content+="\n\n"+t.content; else out.push({role:t.role, content:t.content}) }
  while(out.length&&out[0].role!=="user") out.shift();
  return out;
}
/* One way to ask the AI, whichever route is available */
async function aiJson(prompt, signal, maxTokens){
  if(sample) return sample.json(prompt,{modelTier:"quick", cache:false, signal});
  const text=await apiMessages({messages:[{role:"user",content:prompt}], quick:true, maxTokens:maxTokens||400});
  const a=text.indexOf("["), b=text.lastIndexOf("]");
  if(a<0||b<a) throw {code:"invalid_json"};
  return JSON.parse(text.slice(a,b+1));
}
async function aiChat(rules, turns, onText){
  if(sample){ const {text}=await sample([{role:"user",content:rules},...turns],{cache:false,onText}); return text }
  const text=await apiMessages({system:rules, messages:mergeTurns(turns), quick:false, maxTokens:700});
  if(onText) onText({text});
  return text;
}

/* ---------------- AI connection: why the AI Agent may be unavailable ---------------- */
// S.ai: loading | ready | denied (viewer declined Claude) | none (not opened inside claude.ai / signed out)
//       | off (Claude disabled for the account) | limit (usage limit) | expired (sign-in expired)
S.ai="loading";
function aiUsable(){ return (!!sample||(STANDALONE&&!!apiKey())) && !["denied","off","expired","api_key","standalone"].includes(S.ai) }
async function checkAiDenied(){
  if(!perms||!sample) return;
  try{ const st=await perms.state("sample"); if(st==="denied"){ S.ai="denied" } else if(S.ai==="denied"){ S.ai="ready" } renderAiBanners() }catch(e){}
}
async function ensureSample(){
  if(!sample && samplePromise) await samplePromise;      // the AI connects a moment after the page opens
  if(!sample){ if(STANDALONE&&apiKey()&&S.ai==="standalone") S.ai="ready"; return aiUsable() }
  if(S.ai==="denied") await checkAiDenied();             // maybe switched back on in Permissions
  return aiUsable();
}
function aiFail(e){
  const c=e&&e.code;
  if(c==="not_granted") S.ai="denied";
  else if(["sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)) S.ai="off";
  else if(c==="rate_limited") S.ai="limit";
  else if(c==="session_expired") S.ai="expired";
  else if(c==="api_key") S.ai="api_key";
  else return false;
  renderAiBanners(); return true;
}
function aiReason(){ return T({denied:"ai_denied",none:"ai_none",off:"ai_off",limit:"ai_limit",expired:"ai_expired",loading:"ai_loading",standalone:"ai_standalone",api_key:"ai_badKey"}[S.ai]||"ai_none") }
function aiUnavailableText(){ return aiReason()+"\n\n"+T("asstOff").replace(/^[^.!]*[.!]\s*/,"") }
function renderAiBanners(){
  [["#aiBannerTalk",false],["#aiBannerAsst",true],["#aiBannerEeg",false]].forEach(([id,showLoading])=>{
    const el=$(id); if(!el) return;
    const show=S.ai!=="ready" && (showLoading||S.ai!=="loading");
    el.hidden=!show; if(!show){ el.innerHTML=""; return }
    el.innerHTML=`<span>${esc(aiReason())}</span>`+(S.ai==="denied"&&perms?`<button type="button" class="btn btn-primary ai-allow">${esc(T("ai_allow"))}</button>`:"")
      +((S.ai==="standalone"||S.ai==="api_key")?`<button type="button" class="btn btn-primary ai-key">${esc(T(S.ai==="api_key"?"ai_changeKey":"ai_addKey"))}</button>`:"");
    const b=el.querySelector(".ai-allow"); if(b) b.onclick=openAiPermissions;
    const k=el.querySelector(".ai-key"); if(k) k.onclick=()=>{ location.hash="#assistant"; setTimeout(()=>{ const c=$("#apiCard"); c&&c.scrollIntoView({block:"center"}); $("#apiKey").focus() },80) };
  });
}
async function openAiPermissions(){
  if(!perms){ toast(T("ai_manageFail")); return }
  try{ await perms.manage() }catch(e){ toast(T("ai_manageFail")); return }
  await checkAiDenied();
}
